[extend]
useDefault = true

[[allowlists]]
description = "Synthetic Web Push redaction values in the provider test fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = ['''device-token-secret",\s*"p256dh-secret''']
paths = ['''^internal/providers/webpush_test\.go$''']

[[allowlists]]
description = "Synthetic release commit hash in the immutable workflow test fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = ['''\bRELEASE_COMMIT=[0-9a-f]{40}\b''']
paths = ['''^scripts/release-static\.test\.sh$''']
