      parameters:
        - {"name": "locale", "in": "query", "description": "Display locale only; owners choose a currently authorized published edition or safe permitted fallback. Bound into the page cursor.", "schema": {"type": "string", "enum": ["zh-Hant", "zh-Hans", "en", "ja", "ko"], "default": "zh-Hant"}}
      responses:
        '200':
          description: Current authorized inbox result.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxSummaryResponse'
        '401':
          description: Missing or invalid human identity.
          content:
            application/json:
