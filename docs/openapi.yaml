  /priv/notifications/inbox/batch:
    post:
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [operations-api, engagement-api]
      operationId: acceptInboxBatch
      summary: acceptInboxBatch
      description: >-
        Exact service producer identity; at most 100 items and 64 KiB. Mixed expired or cleaned recipients return terminal indexed outcomes.
        Inbox is disabled by default until both visibility owner contracts are configured.
        All responses are no-store. Dependency failures return unavailable without a false zero or partial count.
      security:
        - daprCaller: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxBatch'
      responses:
        '202':
          description: Durable acceptance. Expired or cleaned outcomes are terminal skips.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxAcceptanceResponse'
        '401':
          description: Missing or invalid human identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxErrorResponse'
        '403':
