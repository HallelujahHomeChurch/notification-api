openapi: 3.1.0
info:
  title: HHC Notification API
  version: 1.0.0
  description: |
    Private Dapr-invoked notification API. Callers create notification intents;
    notification-api owns durable provider delivery and status. Campaign and
    consent state remain owned by engagement-api. Email delivery is at-least-once.
    Provider delivery routes are private. Inbox human routes are available only through the WWW Gateway adapter; catalog access grants no API authorization.
servers:
  - url: /v1.0/invoke/notification-api/method
    description: Dapr sidecar invocation base available to authorized service callers only.
tags:
  - name: Public
    description: WWW human inbox routes, invoked only by the authenticated Gateway.
  - name: Private
    description: Service-to-service operations invoked through Dapr.
  - name: Operations
    description: Process health and readiness operations.
x-hhc-service: notification-api
x-hhc-owner: HHC Platform
x-hhc-repository: HallelujahHomeChurch/notification-api
paths:
  /health:
    get:
      tags: [Operations]
      x-hhc-visibility: operations
      x-hhc-callers: []
      operationId: health
      summary: Check whether the process is running
      security: []
      responses:
        '200':
          description: Process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags: [Operations]
      x-hhc-visibility: operations
      x-hhc-callers: []
      operationId: ready
      summary: Check whether required dependencies are ready
      security: []
      responses:
        '200':
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotReadyErrorResponse'
  /priv/account-cleanup:
    post:
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [account-api]
      operationId: cleanupDeletedAccountNotifications
      summary: Remove attributed Notification payloads for manual Account deletion
      description: Tombstones attributed target and payload data without creating or advancing a DSR request.
      security:
        - daprCaller: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCleanupRequest' }
      responses:
        '200':
          description: Current idempotent cleanup postcondition; safe to retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountCleanupResponse' }
        '400':
          description: Invalid cleanup request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvalidRequestErrorResponse' }
        '401':
          description: Dapr caller identity is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnauthorizedErrorResponse' }
        '403':
          description: Caller is not account-api.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForbiddenErrorResponse' }
        '500':
          description: Notification cleanup failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalErrorResponse' }
  /priv/notifications/send:
    post:
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [account-api, engagement-api]
      operationId: sendNotification
      summary: Create a durable notification intent
      description: |
        Creates one caller-scoped notification intent. Repeating the same
        Idempotency-Key and request returns the original intent; reusing the key
        for different content returns a conflict. Provider delivery is asynchronous.
      security:
        - daprCaller: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequest'
      responses:
        '202':
          description: Notification intent accepted for durable delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'
        '400':
          description: Request or idempotency key is invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvalidRequestErrorResponse' }
        '401':
          description: Dapr caller identity is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnauthorizedErrorResponse' }
        '403':
          description: Caller or requested template is not allowed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForbiddenErrorResponse' }
        '409':
          description: Idempotency key was reused with different request content.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdempotencyConflictErrorResponse' }
        '429':
          description: Caller or template rate limit was exceeded.
          headers:
            Retry-After:
              description: Whole seconds until the caller may retry.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateLimitedErrorResponse' }
        '500':
          description: Notification intent could not be created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalErrorResponse' }
        '503':
          description: Creation of new notification intents is disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisabledErrorResponse' }
  /priv/notifications/{messageId}:
    get:
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [account-api, engagement-api]
      operationId: getNotificationStatus
      summary: Get caller-scoped durable delivery status
      security:
        - daprCaller: []
      parameters:
        - name: messageId
          in: path
          required: true
          description: Opaque notification intent identifier returned by sendNotification.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification status for the original caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationStatusResponse'
        '401':
          description: Dapr caller identity is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnauthorizedErrorResponse' }
        '403':
          description: Caller is not allowed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForbiddenErrorResponse' }
        '404':
          description: Message does not exist or belongs to another caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotFoundErrorResponse' }
        '500':
          description: Notification status could not be read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalErrorResponse' }
  /api/notifications/me:
    get:
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      operationId: listMyNotifications
      summary: listMyNotifications
      description: >-
        Exact api-gateway Dapr identity and matching canonical X-HHC-User-ID/X-HHC-Principal-ID with X-HHC-Principal-Type=user. Gateway owns WWW host and CSRF policy.
        Inbox is disabled by default until both visibility owner contracts are configured.
        All responses are no-store. Dependency failures return unavailable without a false zero or partial count.
      security:
        - daprCaller: []
      parameters:
        - {"name": "locale", "in": "query", "description": "Display locale only; owners choose a currently authorized published edition or safe permitted fallback. Bound into the page cursor.", "schema": {"type": "string", "enum": ["zh-Hant", "zh-Hans", "en", "ja", "ko"], "default": "zh-Hant"}}
        - {"name": "filter", "in": "query", "schema": {"type": "string", "enum": ["all", "unread"], "default": "all"}}
        - {"name": "cursor", "in": "query", "schema": {"type": "string", "maxLength": 4096}, "description": "Signed actor/filter-bound cursor; pages scan at most 500 candidates and may be short or empty with a continuation."}
        - {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 50, "default": 20}}
      responses:
        '200':
          description: Current authorized inbox result.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxPageResponse'
        '401':
          description: Missing or invalid human identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxErrorResponse'
        '403':
          description: Caller or principal is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxErrorResponse'
        '404':
          description: Owned item is inaccessible or absent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxErrorResponse'
        '409':
          description: Logical identity conflicts with another type or resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxErrorResponse'
        '422':
          description: Invalid schema, token, filter or limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxErrorResponse'
        '503':
          description: Inbox is disabled or authoritative visibility/count is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxErrorResponse'
  /api/notifications/me/summary:
    get:
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      operationId: summarizeMyNotifications
      summary: summarizeMyNotifications
      description: >-
