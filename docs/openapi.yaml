        '403':
          description: Caller or principal is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxErrorResponse'
        '404':
          description: Owned item is inaccessible or absent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxErrorResponse'
        '409':
          description: Logical identity conflicts with another type or resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxErrorResponse'
        '422':
          description: Invalid schema, token, filter or limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxErrorResponse'
        '503':
          description: Inbox is disabled or authoritative visibility/count is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxErrorResponse'
  /api/notifications/me/{id}/read:
    post:
      tags: [Public]
      x-hhc-visibility: public
      x-hhc-callers: [api-gateway]
      operationId: readMyNotification
