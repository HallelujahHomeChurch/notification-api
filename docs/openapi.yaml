openapi: 3.1.0
info:
  title: HHC Notification API
  version: 1.0.0
  description: |
    Private Dapr-invoked notification API. Callers create notification intents;
    notification-api owns durable provider delivery and status. Campaign and
    consent state remain owned by engagement-api. Email delivery is at-least-once.
    This API is not browser-callable, and catalog access grants no API authorization.
servers:
  - url: /v1.0/invoke/notification-api/method
    description: Dapr sidecar invocation base available to authorized service callers only.
tags:
  - name: Private
    description: Service-to-service operations invoked through Dapr.
  - name: Operations
    description: Process health and readiness operations.
x-hhc-service: notification-api
x-hhc-owner: HHC Platform
x-hhc-repository: HallelujahHomeChurch/notification-api
paths:
  /health:
    get:
      tags: [Operations]
      x-hhc-visibility: operations
      x-hhc-callers: []
      operationId: health
      summary: Check whether the process is running
      security: []
      responses:
        '200':
          description: Process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags: [Operations]
      x-hhc-visibility: operations
      x-hhc-callers: []
      operationId: ready
      summary: Check whether required dependencies are ready
      security: []
      responses:
        '200':
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotReadyErrorResponse'
  /priv/dsr/exports:
    post:
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [account-api]
      operationId: exportDSRNotificationRecords
      summary: Export redacted Notification records for a verified Account email
      description: Canonical email is accepted only to derive internal retained hash-key lookups. Responses contain notification metadata only.
      security:
        - daprCaller: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DSRExportRequest' }
      responses:
        '200':
          description: Keyset-paged notification metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DSRExportResponse' }
        '400':
          description: Invalid DSR request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvalidRequestErrorResponse' }
        '401':
          description: Dapr caller identity is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnauthorizedErrorResponse' }
        '403':
          description: Caller is not account-api.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForbiddenErrorResponse' }
        '500':
          description: Notification metadata could not be read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalErrorResponse' }
  /priv/dsr/actions:
    post:
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [account-api]
      operationId: applyDSRNotificationAction
      summary: Apply a Notification DSR action for a verified Account email
      description: Erasure tombstones attributed target and payload data while retaining ordinary delivery receipt metadata. Restrict processing is not applicable because Notification does not own consent or targeting.
      security:
        - daprCaller: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DSRActionRequest' }
      responses:
        '200':
          description: Terminal DSR action result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DSRActionResponse' }
        '400':
          description: Invalid DSR request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvalidRequestErrorResponse' }
        '401':
          description: Dapr caller identity is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnauthorizedErrorResponse' }
        '403':
          description: Caller is not account-api.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForbiddenErrorResponse' }
        '500':
          description: Notification DSR action could not be applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalErrorResponse' }
  /priv/notifications/send:
    post:
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [account-api, engagement-api]
      operationId: sendNotification
      summary: Create a durable notification intent
      description: |
        Creates one caller-scoped notification intent. Repeating the same
        Idempotency-Key and request returns the original intent; reusing the key
        for different content returns a conflict. Provider delivery is asynchronous.
      security:
        - daprCaller: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequest'
      responses:
        '202':
          description: Notification intent accepted for durable delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'
        '400':
          description: Request or idempotency key is invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvalidRequestErrorResponse' }
        '401':
          description: Dapr caller identity is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnauthorizedErrorResponse' }
        '403':
          description: Caller or requested template is not allowed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForbiddenErrorResponse' }
        '409':
          description: Idempotency key was reused with different request content.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdempotencyConflictErrorResponse' }
        '429':
          description: Caller or template rate limit was exceeded.
          headers:
            Retry-After:
              description: Whole seconds until the caller may retry.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateLimitedErrorResponse' }
        '500':
          description: Notification intent could not be created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalErrorResponse' }
        '503':
          description: Creation of new notification intents is disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisabledErrorResponse' }
  /priv/notifications/{messageId}:
    get:
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [account-api, engagement-api]
      operationId: getNotificationStatus
      summary: Get caller-scoped durable delivery status
      security:
        - daprCaller: []
      parameters:
        - name: messageId
          in: path
          required: true
          description: Opaque notification intent identifier returned by sendNotification.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification status for the original caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationStatusResponse'
        '401':
          description: Dapr caller identity is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnauthorizedErrorResponse' }
        '403':
          description: Caller is not allowed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForbiddenErrorResponse' }
        '404':
          description: Message does not exist or belongs to another caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotFoundErrorResponse' }
        '500':
          description: Notification status could not be read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalErrorResponse' }
components:
  securitySchemes:
    daprCaller:
      type: apiKey
      in: header
      name: Dapr-Caller-App-Id
      description: Caller identity injected by Dapr and checked against the runtime allowlist.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1-200 visible ASCII characters, retained until 730 days after the notification reaches a terminal state; non-terminal notifications retain it longer.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: '^[\x21-\x7E]{1,200}$'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: healthy }
    ReadyResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ready }
    SendRequest:
      type: object
      additionalProperties: false
      required: [templateId, channel, target, payload, resource]
      oneOf:
        - properties:
            channel: { const: email }
            target: { $ref: '#/components/schemas/EmailTarget' }
        - properties:
            channel: { const: web_push }
            target: { $ref: '#/components/schemas/WebPushTarget' }
      properties:
        templateId:
          type: string
          description: Registered template identifier allowed for the authenticated caller.
          examples: [account.verify-email]
        channel:
          type: string
          enum: [email, web_push]
        target:
          oneOf:
            - $ref: '#/components/schemas/EmailTarget'
            - $ref: '#/components/schemas/WebPushTarget'
        locale:
          type: string
          description: Current v2 templates support zh-Hant, zh-Hans, and en. Unsupported or omitted locales fall back to en.
        payload:
          type: object
          description: Template-specific string fields validated by notification-api.
          additionalProperties:
            type: string
        resource:
          $ref: '#/components/schemas/Resource'
    EmailTarget:
      type: object
      additionalProperties: false
      required: [type, address]
      properties:
        type: { const: email }
        address:
          type: string
          format: email
          minLength: 1
          description: Email address accepted by Go mail.ParseAddress after trimming and lowercase normalization. Stored encrypted.
    WebPushTarget:
      type: object
      additionalProperties: false
      required: [type, address]
      properties:
        type: { const: web_push }
        address:
          type: string
          minLength: 1
          description: Serialized strict JSON object containing an HTTPS endpoint and non-blank p256dh and auth keys; unknown fields are rejected. Stored encrypted.
    Resource:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          pattern: '.*\S.*'
          description: Owning business resource type, such as account or campaign.
        id:
          type: string
          pattern: '.*\S.*'
          description: Opaque identifier assigned by the owning caller.
    SendResponse:
      type: object
      additionalProperties: false
      required: [data, meta, error]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [messageId, status, templateVersion, replayed]
          properties:
            messageId:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/MessageStatus'
            templateVersion:
              type: integer
              minimum: 1
            replayed:
              type: boolean
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        error:
          type: 'null'
    NotificationStatusResponse:
      type: object
      additionalProperties: false
      required: [data, meta, error]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [messageId, status]
          properties:
            messageId:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/MessageStatus'
            failureCode:
              type: string
              description: Stable, non-sensitive failure category for terminal delivery failures.
              enum: [temporary, rate_limited, acceptance_unknown, permanent, invalid_endpoint, suppressed, expired]
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        error:
          type: 'null'
    MessageStatus:
      type: string
      enum: [queued, sending, sent, failed, dead_lettered]
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId:
          type: string
    DSRExportRequest:
      type: object
      additionalProperties: false
      required: [requestId, userId, canonicalEmail]
      properties:
        requestId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        canonicalEmail: { type: string, format: email, minLength: 1, description: Verified Account canonical email; accepted only by notification-api to derive retained hash-key lookups. }
        cursor: { type: string, maxLength: 1024 }
        limit: { type: integer, minimum: 1, maximum: 100 }
    DSRActionRequest:
      type: object
      additionalProperties: false
      required: [requestId, userId, canonicalEmail, action, idempotencyKey]
      properties:
        requestId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        canonicalEmail: { type: string, format: email, minLength: 1, description: Verified Account canonical email; accepted only by notification-api to derive retained hash-key lookups. }
        action: { type: string, enum: [restrict_processing, erase] }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
    DSRExportResponse:
      type: object
      additionalProperties: false
      required: [data, meta, error]
      properties:
        data: { $ref: '#/components/schemas/DSRExportPage' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
        error: { type: 'null' }
    DSRActionResponse:
      type: object
      additionalProperties: false
      required: [data, meta, error]
      properties:
        data: { $ref: '#/components/schemas/DSRActionResult' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
        error: { type: 'null' }
    DSRExportPage:
      type: object
      additionalProperties: false
      required: [records, recordCount, exceptions]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/DSRExportRecord' }
        nextCursor: { type: string }
        recordCount: { type: integer, minimum: 0 }
        exceptions:
          type: array
          items: { $ref: '#/components/schemas/DSRException' }
    DSRExportRecord:
      type: object
      additionalProperties: false
      required: [recordType, recordKey, templateId, channel, status, createdAt, updatedAt]
      properties:
        recordType: { const: notification_message }
        recordKey: { type: string, format: uuid }
        templateId: { type: string }
        channel: { type: string, enum: [email, web_push] }
        status: { $ref: '#/components/schemas/MessageStatus' }
        deliveryStatus: { $ref: '#/components/schemas/MessageStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DSRException:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string }
        count: { type: integer, format: int64, minimum: 0 }
    DSRActionResult:
      type: object
      additionalProperties: false
      required: [owner, action, status, recordCount, reasonCodes]
      oneOf:
        - properties:
            action: { const: restrict_processing }
            status: { const: not_applicable }
        - properties:
            action: { const: erase }
            status: { const: completed }
      properties:
        owner: { const: notification-api }
        action: { type: string, enum: [restrict_processing, erase] }
        status: { type: string, enum: [completed, not_applicable] }
        recordCount: { type: integer, format: int64, minimum: 0 }
        reasonCodes:
          type: array
          items: { type: string }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [data, meta, error]
      properties:
        data:
          type: 'null'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code:
              type: string
    InvalidRequestErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - properties:
            error:
              properties:
                code: { const: NTF_INVALID_REQUEST }
    UnauthorizedErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - properties:
            error:
              properties:
                code: { const: NTF_UNAUTHORIZED }
    ForbiddenErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - properties:
            error:
              properties:
                code: { const: NTF_FORBIDDEN }
    IdempotencyConflictErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - properties:
            error:
              properties:
                code: { const: NTF_IDEMPOTENCY_CONFLICT }
    RateLimitedErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - properties:
            error:
              properties:
                code: { const: NTF_RATE_LIMITED }
    NotFoundErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - properties:
            error:
              properties:
                code: { const: NTF_NOT_FOUND }
    NotReadyErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - properties:
            error:
              properties:
                code: { const: NTF_NOT_READY }
    DisabledErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - properties:
            error:
              properties:
                code: { const: NTF_DISABLED }
    InternalErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - properties:
            error:
              properties:
                code: { const: NTF_INTERNAL }
