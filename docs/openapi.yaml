openapi: 3.1.0
info:
  title: HHC Notification API
  version: 1.0.0
  description: |
    Private Dapr-invoked notification API. Callers create notification intents;
    notification-api owns durable provider delivery and status. Campaign and
    consent state remain owned by engagement-api. Email delivery is at-least-once.
    This API is not browser-callable, and catalog access grants no API authorization.
servers:
  - url: /v1.0/invoke/notification-api/method
    description: Dapr sidecar invocation base available to authorized service callers only.
tags:
  - name: Private
    description: Service-to-service operations invoked through Dapr.
  - name: Operations
    description: Process health and readiness operations.
x-hhc-service: notification-api
x-hhc-owner: HHC Platform
x-hhc-repository: HallelujahHomeChurch/notification-api
paths:
  /health:
    get:
      tags: [Operations]
      x-hhc-visibility: operations
      x-hhc-callers: []
      operationId: health
      summary: Check whether the process is running
      security: []
      responses:
        '200':
          description: Process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags: [Operations]
      x-hhc-visibility: operations
      x-hhc-callers: []
      operationId: ready
      summary: Check whether the application is initialized
      security: []
      responses:
        '200':
          description: The application is initialized and serving.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: The application is not initialized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotReadyErrorResponse'
  /priv/account-cleanup:
    post:
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [account-api]
      operationId: cleanupDeletedAccountNotifications
      summary: Remove attributed Notification payloads for manual Account deletion
      description: Tombstones attributed target and payload data without creating or advancing a DSR request.
      security:
        - daprCaller: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCleanupRequest' }
      responses:
        '200':
          description: Current idempotent cleanup postcondition; safe to retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountCleanupResponse' }
        '400':
          description: Invalid cleanup request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvalidRequestErrorResponse' }
        '401':
          description: Dapr caller identity is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnauthorizedErrorResponse' }
        '403':
          description: Caller is not account-api.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForbiddenErrorResponse' }
        '500':
          description: Notification cleanup failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalErrorResponse' }
  /priv/notifications/send:
    post:
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [account-api, engagement-api]
      operationId: sendNotification
      summary: Create a durable notification intent
      description: |
        Creates one caller-scoped notification intent. Repeating the same
        Idempotency-Key and request returns the original intent; reusing the key
        for different content returns a conflict. Provider delivery is asynchronous.
      security:
        - daprCaller: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequest'
      responses:
        '202':
          description: Notification intent accepted for durable delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'
        '400':
          description: Request or idempotency key is invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvalidRequestErrorResponse' }
        '401':
          description: Dapr caller identity is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnauthorizedErrorResponse' }
        '403':
          description: Caller or requested template is not allowed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForbiddenErrorResponse' }
        '409':
          description: Idempotency key was reused with different request content.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdempotencyConflictErrorResponse' }
        '429':
          description: Caller or template rate limit was exceeded.
          headers:
            Retry-After:
              description: Whole seconds until the caller may retry.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateLimitedErrorResponse' }
        '500':
          description: Notification intent could not be created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalErrorResponse' }
        '503':
          description: Creation of new notification intents is disabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisabledErrorResponse' }
  /priv/notifications/{messageId}:
    get:
      tags: [Private]
      x-hhc-visibility: private
      x-hhc-callers: [account-api, engagement-api]
      operationId: getNotificationStatus
      summary: Get caller-scoped durable delivery status
      security:
        - daprCaller: []
      parameters:
        - name: messageId
          in: path
          required: true
          description: Opaque notification intent identifier returned by sendNotification.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification status for the original caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationStatusResponse'
        '401':
          description: Dapr caller identity is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnauthorizedErrorResponse' }
        '403':
          description: Caller is not allowed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForbiddenErrorResponse' }
        '404':
          description: Message does not exist or belongs to another caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotFoundErrorResponse' }
        '500':
          description: Notification status could not be read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalErrorResponse' }
components:
  securitySchemes:
    daprCaller:
      type: apiKey
      in: header
      name: Dapr-Caller-App-Id
      description: Caller identity injected by Dapr and checked against the runtime allowlist.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1-200 visible ASCII characters, retained until 730 days after the notification reaches a terminal state; non-terminal notifications retain it longer.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: '^[\x21-\x7E]{1,200}$'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: healthy }
    ReadyResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ready }
    SendRequest:
      type: object
      additionalProperties: false
      required: [templateId, channel, target, payload, resource]
      oneOf:
        - properties:
            channel: { const: email }
            target: { $ref: '#/components/schemas/EmailTarget' }
        - properties:
            channel: { const: web_push }
            target: { $ref: '#/components/schemas/WebPushTarget' }
      properties:
        templateId:
          type: string
          description: >-
            Registered template identifier allowed for the authenticated caller.
            account.oauth-onboarding-code v4 accepts code, provider, and optional
            payload.expiresAt (RFC3339 absolute code deadline). When supplied it must
            match the top-level expiresAt, and the email displays that absolute deadline.
            Omission retains a 30-minute expiry message for older callers.
            Delivery TTL is capped at 30 minutes; recipient admission is one per
            3-minute fixed window and five per 24 hours. Other templates retain
            their existing admission limits.
            Account-only email-correction v1 templates: account.email-correction-verify
            (verifyUrl, mandatory expiresAt, 30-minute delivery TTL),
            account.email-correction-security-notice (actionUrl),
            account.email-correction-admin-review (reviewUrl), and
            account.email-correction-completed (actionUrl). Notices have a 24-hour delivery TTL.
            Each requires a canonical nonzero applicant subjectAccountId and resource
            type email_correction with a canonical nonzero request UUID.
            Only the named URL field is accepted. Verification uses
            https://account.alive.org.tw/data-requests/verify-email#token=BASE64URL_TOKEN;
            review uses https://admin.alive.org.tw/data-requests/{resource.id};
            security and completion use https://account.alive.org.tw/security and
            https://account.alive.org.tw/login respectively. No query strings or
            other fragments are accepted. Existing HTTP loopback origins remain available for local tests.
          examples: [account.verify-email]
        channel:
          type: string
          enum: [email, web_push]
        target:
          oneOf:
            - $ref: '#/components/schemas/EmailTarget'
            - $ref: '#/components/schemas/WebPushTarget'
        locale:
          type: string
          description: Current v2 templates support zh-Hant, zh-Hans, and en; email-correction v1 also supports ja and ko. Unsupported or omitted locales fall back to en.
        payload:
          type: object
          description: Template-specific string fields validated by notification-api.
          additionalProperties:
            type: string
        resource:
          $ref: '#/components/schemas/Resource'
        expiresAt:
          type: string
          format: date-time
          description: >-
            Optional original absolute delivery deadline, normalized to UTC for idempotency.
            Stored expiry is the earlier of this value and database-now plus template TTL.
            Mandatory and nonzero for account.email-correction-verify. Omission preserves
            existing request hashes and TTL behavior. Accepted idempotent replays remain
            valid after expiry; a new expired intent is queued then settled as expired
            without provider delivery. Expiry never extends on dispatch or retry.
        subjectAccountId:
          type: string
          format: uuid
          description: Optional Account subject attribution. Required for email-correction templates and always identifies the applicant, including admin-review messages sent to a different administrator. Only account-api and engagement-api may set it; notification-api stores only an HMAC and key ID.
    EmailTarget:
      type: object
      additionalProperties: false
      required: [type, address]
      properties:
        type: { const: email }
        address:
          type: string
          format: email
          minLength: 1
          description: Email address accepted by Go mail.ParseAddress after trimming and lowercase normalization. Stored encrypted.
    WebPushTarget:
      type: object
      additionalProperties: false
      required: [type, address]
      properties:
        type: { const: web_push }
        address:
          type: string
          minLength: 1
          description: Serialized strict JSON object containing an HTTPS endpoint and non-blank p256dh and auth keys; unknown fields are rejected. Stored encrypted.
    Resource:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          pattern: '.*\S.*'
          description: Owning business resource type, such as account or campaign.
        id:
          type: string
          pattern: '.*\S.*'
          description: Opaque identifier assigned by the owning caller.
    SendResponse:
      type: object
      additionalProperties: false
      required: [data, meta, error]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [messageId, status, templateVersion, replayed]
          properties:
            messageId:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/MessageStatus'
            templateVersion:
              type: integer
              minimum: 1
            replayed:
              type: boolean
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        error:
          type: 'null'
    NotificationStatusResponse:
      type: object
      additionalProperties: false
      required: [data, meta, error]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [messageId, status]
          properties:
            messageId:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/MessageStatus'
            safeToRetry:
              type: boolean
              description: Affirmative proof that a terminal unexpired retained Email has complete attempt history with definitive rejection and no accepted, unknown or incomplete send. False for legacy history. Consumers must treat a missing field as false; this does not authorize replay without current consent and source eligibility.
            failureCode:
              type: string
              description: Stable, non-sensitive failure category for terminal delivery failures.
              enum: [temporary, rate_limited, acceptance_unknown, permanent, invalid_endpoint, suppressed, expired]
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        error:
          type: 'null'
    MessageStatus:
      type: string
      enum: [queued, sending, sent, failed, dead_lettered, suppressed]
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId:
          type: string
    AccountCleanupRequest:
      type: object
      additionalProperties: false
      required: [userId, canonicalEmail, idempotencyKey]
      properties:
        userId: { type: string, format: uuid }
        canonicalEmail: { type: string, format: email, minLength: 1 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
    AccountCleanupResponse:
      type: object
      additionalProperties: false
      required: [data, meta, error]
      properties:
        data: { $ref: '#/components/schemas/AccountCleanupResult' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
        error: { type: 'null' }
    AccountCleanupResult:
      type: object
      additionalProperties: false
      required: [owner, status, recordCount, remainingCount, reasonCodes]
      properties:
        owner: { const: notification-api }
        status: { type: string, enum: [pending, completed] }
        recordCount: { type: integer, format: int64, minimum: 0 }
        remainingCount: { type: integer, format: int64, minimum: 0 }
        reasonCodes:
          type: array
          items: { type: string, enum: [legacy_unattributed_notifications] }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [data, meta, error]
      properties:
        data:
          type: 'null'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code:
              type: string
    InvalidRequestErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - properties:
            error:
              properties:
                code: { const: NTF_INVALID_REQUEST }
    UnauthorizedErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - properties:
            error:
              properties:
                code: { const: NTF_UNAUTHORIZED }
    ForbiddenErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - properties:
            error:
              properties:
                code: { const: NTF_FORBIDDEN }
    IdempotencyConflictErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - properties:
            error:
              properties:
                code: { const: NTF_IDEMPOTENCY_CONFLICT }
    RateLimitedErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - properties:
            error:
              properties:
                code: { const: NTF_RATE_LIMITED }
    NotFoundErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - properties:
            error:
              properties:
                code: { const: NTF_NOT_FOUND }
    NotReadyErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - properties:
            error:
              properties:
                code: { const: NTF_NOT_READY }
    DisabledErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - properties:
            error:
              properties:
                code: { const: NTF_DISABLED }
    InternalErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - properties:
            error:
              properties:
                code: { const: NTF_INTERNAL }
