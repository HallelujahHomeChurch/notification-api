name: Production Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - infra/**
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notification_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d notification_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/notification_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify
        run: |
          go test ./...
          go test -tags=integration ./... -count=1
          go vet ./...
          bash scripts/release-static.test.sh

  deploy:
    name: Build, migrate, and deploy
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: alive
      ACR_LOGIN_SERVER: alive.azurecr.io
      IMAGE_REPOSITORY: alive/notification-api
      RESOURCE_GROUP: alive
      MIGRATION_JOB_NAME: notification-migrate
      API_APP_NAME: notification-api
      WORKER_APP_NAME: notification-worker
      API_GATEWAY_APP_NAME: api-gateway
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      SMTP_ADDR: ${{ vars.SMTP_ADDR }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      SMTP_AUTHENTICATION_ENABLED: ${{ vars.SMTP_AUTHENTICATION_ENABLED }}
      NOTIFICATION_TEMPLATE_DAILY_LIMIT: ${{ vars.NOTIFICATION_TEMPLATE_DAILY_LIMIT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release configuration
        shell: bash
        run: |
          required_vars=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            SMTP_ADDR
            SMTP_FROM
            SMTP_AUTHENTICATION_ENABLED
            NOTIFICATION_TEMPLATE_DAILY_LIMIT
          )
          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required repository variable: ${name}" >&2
              exit 1
            fi
          done
          case "${SMTP_AUTHENTICATION_ENABLED}" in
            true|false) ;;
            *)
              echo "SMTP_AUTHENTICATION_ENABLED must be true or false" >&2
              exit 1
              ;;
          esac
          if ! [[ "${NOTIFICATION_TEMPLATE_DAILY_LIMIT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "NOTIFICATION_TEMPLATE_DAILY_LIMIT must be a positive integer" >&2
            exit 1
          fi

      - name: Set image tag
        shell: bash
        run: echo "IMAGE_TAG=main-${GITHUB_SHA::7}" >> "${GITHUB_ENV}"

      - name: Sign in to Azure with OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Capture runtime state and preflight monitoring
        shell: bash
        run: |
          previous_api_revision="$(az containerapp show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${API_APP_NAME}" \
            --query "properties.latestReadyRevisionName" \
            --output tsv \
            --only-show-errors)"
          previous_worker_revision="$(az containerapp show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${WORKER_APP_NAME}" \
            --query "properties.latestReadyRevisionName" \
            --output tsv \
            --only-show-errors)"
          previous_api_image="$(az containerapp revision show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${API_APP_NAME}" \
            --revision "${previous_api_revision}" \
            --query "properties.template.containers[0].image" \
            --output tsv \
            --only-show-errors)"
          previous_worker_image="$(az containerapp revision show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${WORKER_APP_NAME}" \
            --revision "${previous_worker_revision}" \
            --query "properties.template.containers[0].image" \
            --output tsv \
            --only-show-errors)"
          notifications_disabled="$(az containerapp show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${API_APP_NAME}" \
            --query "properties.template.containers[0].env[?name=='NOTIFICATIONS_DISABLED'].value | [0]" \
            --output tsv \
            --only-show-errors)"
          notifications_disabled="${notifications_disabled:-false}"
          notifications_disabled="${notifications_disabled,,}"
          if [[ -z "${previous_api_revision}" || -z "${previous_worker_revision}" || -z "${previous_api_image}" || -z "${previous_worker_image}" ]]; then
            echo "Unable to capture current Ready revisions" >&2
            exit 1
          fi
          case "${notifications_disabled}" in
            false) ;;
            true)
              echo "NOTIFICATIONS_DISABLED=true; refusing to release during an active notification incident" >&2
              exit 1
              ;;
            *)
              echo "Invalid deployed NOTIFICATIONS_DISABLED value: ${notifications_disabled}" >&2
              exit 1
              ;;
          esac
          az monitor action-group show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "RecommendedAlertRules-AG-1" \
            --only-show-errors \
            --output none
          {
            echo "PREVIOUS_API_REVISION=${previous_api_revision}"
            echo "PREVIOUS_WORKER_REVISION=${previous_worker_revision}"
            echo "PREVIOUS_API_IMAGE=${previous_api_image}"
            echo "PREVIOUS_WORKER_IMAGE=${previous_worker_image}"
            echo "NOTIFICATIONS_DISABLED=${notifications_disabled}"
          } >> "${GITHUB_ENV}"

      - name: Deploy rate-limit alert
        shell: bash
        run: |
          az deployment group create \
            --name "notification-alerts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/alerts.bicep \
            --only-show-errors \
            --output none

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry "${ACR_NAME}" \
            --image "${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            --file Dockerfile \
            .

      - name: Update migration job
        shell: bash
        run: |
          image_ref="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          az deployment group create \
            --name "notification-migrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/main.bicep \
            --parameters \
              migrationImage="${image_ref}" \
              runtimeImage="${image_ref}" \
              deployRuntime=false \
              provisionPermissions=false \
              smtpAddr="${SMTP_ADDR}" \
              smtpFrom="${SMTP_FROM}" \
              smtpAuthenticationEnabled="${SMTP_AUTHENTICATION_ENABLED}" \
              notificationTemplateDailyLimit="${NOTIFICATION_TEMPLATE_DAILY_LIMIT}" \
              notificationsDisabled="${NOTIFICATIONS_DISABLED}" \
            --only-show-errors \
            --output none

      - name: Run migrations
        shell: bash
        run: |
          execution_name="$(az containerapp job start \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${MIGRATION_JOB_NAME}" \
            --query name \
            --output tsv \
            --only-show-errors)"
          if [[ -z "${execution_name}" ]]; then
            echo "Migration job did not return an execution name" >&2
            exit 1
          fi

          for attempt in {1..60}; do
            status="$(az containerapp job execution list \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${MIGRATION_JOB_NAME}" \
              --query "[?name=='${execution_name}'].properties.status | [0]" \
              --output tsv \
              --only-show-errors)"
            case "${status}" in
              Succeeded)
                echo "Migration execution ${execution_name} succeeded"
                exit 0
                ;;
              Failed|Canceled|Cancelled|Stopped)
                echo "Migration execution ${execution_name} ended with ${status}" >&2
                exit 1
                ;;
            esac
            echo "Waiting for migration execution ${execution_name}: ${status:-Pending} (${attempt}/60)"
            sleep 10
          done

          echo "Migration execution ${execution_name} did not succeed before timeout" >&2
          exit 1

      - name: Deploy API and worker
        id: deploy_runtime
        shell: bash
        run: |
          image_ref="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          az deployment group create \
            --name "notification-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/main.bicep \
            --parameters \
              migrationImage="${image_ref}" \
              runtimeImage="${image_ref}" \
              deployRuntime=true \
              provisionPermissions=false \
              smtpAddr="${SMTP_ADDR}" \
              smtpFrom="${SMTP_FROM}" \
              smtpAuthenticationEnabled="${SMTP_AUTHENTICATION_ENABLED}" \
              notificationTemplateDailyLimit="${NOTIFICATION_TEMPLATE_DAILY_LIMIT}" \
              notificationsDisabled="${NOTIFICATIONS_DISABLED}" \
            --only-show-errors \
            --output none

      - name: Wait for API and worker revisions
        id: wait_runtime
        shell: bash
        run: |
          image_ref="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          wait_for_revision() {
            local app_name="$1"
            for attempt in {1..60}; do
              state="$(az containerapp show \
                --resource-group "${RESOURCE_GROUP}" \
                --name "${app_name}" \
                --query "join('|', [properties.latestRevisionName, properties.latestReadyRevisionName])" \
                --output tsv \
                --only-show-errors)"
              IFS='|' read -r latest ready <<< "${state}"
              deployed_image=""
              if [[ -n "${latest}" && "${latest}" == "${ready}" ]]; then
                deployed_image="$(az containerapp revision show \
                  --resource-group "${RESOURCE_GROUP}" \
                  --name "${app_name}" \
                  --revision "${ready}" \
                  --query "properties.template.containers[0].image" \
                  --output tsv \
                  --only-show-errors)"
                if [[ "${deployed_image}" == "${image_ref}" ]]; then
                  echo "${app_name} is ready on ${ready} with ${image_ref}"
                  return 0
                fi
              fi
              echo "Waiting for ${app_name}: latest=${latest:-none} ready=${ready:-none} image=${deployed_image:-none} (${attempt}/60)"
              sleep 10
            done
            echo "${app_name} did not become ready with ${image_ref}" >&2
            return 1
          }

          wait_for_revision "${API_APP_NAME}"
          wait_for_revision "${WORKER_APP_NAME}"

      - name: Verify Dapr readiness through API gateway
        id: smoke_runtime
        shell: bash
        run: |
          dapr_url="http://localhost:3500/v1.0/invoke/notification-api/method/ready"
          probe_exit=0
          probe_output="$(timeout 60s script -q -e -c \
            "az containerapp exec --resource-group \"${RESOURCE_GROUP}\" --name \"${API_GATEWAY_APP_NAME}\" --command \"/usr/bin/wget -S -O - ${dapr_url}\"" \
            /dev/null 2>&1)" || probe_exit=$?
          probe_output="${probe_output//$'\r'/}"
          printf '%s\n' "${probe_output}"

          if (( probe_exit == 124 )); then
            echo "Dapr readiness probe timed out after 60 seconds" >&2
            exit 1
          fi
          if ! grep -Eq 'HTTP/1\.[01][[:space:]]+200' <<< "${probe_output}"; then
            echo "Dapr readiness probe did not return HTTP 200" >&2
            exit 1
          fi
          if ! grep -Eq '"status"[[:space:]]*:[[:space:]]*"ready"' <<< "${probe_output}"; then
            echo "Dapr readiness probe returned an unexpected body" >&2
            exit 1
          fi
          if (( probe_exit != 0 )); then
            echo "Dapr readiness probe command failed with exit ${probe_exit}" >&2
            exit 1
          fi

      - name: Roll back runtime after failed deployment verification
        if: ${{ failure() && steps.deploy_runtime.outcome != 'skipped' }}
        shell: bash
        run: |
          rollback() {
            local app_name="$1"
            local previous_revision="$2"
            local image_ref="$3"
            az containerapp revision copy \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${app_name}" \
              --from-revision "${previous_revision}" \
              --revision-suffix "rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --only-show-errors \
              --output none
            for attempt in {1..60}; do
              state="$(az containerapp show \
                --resource-group "${RESOURCE_GROUP}" \
                --name "${app_name}" \
                --query "join('|', [properties.latestRevisionName, properties.latestReadyRevisionName])" \
                --output tsv \
                --only-show-errors)"
              IFS='|' read -r latest ready <<< "${state}"
              if [[ -n "${latest}" && "${latest}" == "${ready}" ]]; then
                deployed_image="$(az containerapp revision show \
                  --resource-group "${RESOURCE_GROUP}" \
                  --name "${app_name}" \
                  --revision "${ready}" \
                  --query "properties.template.containers[0].image" \
                  --output tsv \
                  --only-show-errors)"
                if [[ "${deployed_image}" == "${image_ref}" ]]; then
                  echo "Rolled back ${app_name} to ${image_ref}"
                  return 0
                fi
              fi
              sleep 10
            done
            echo "Rollback failed for ${app_name}" >&2
            return 1
          }

          rollback_status=0
          rollback "${API_APP_NAME}" "${PREVIOUS_API_REVISION}" "${PREVIOUS_API_IMAGE}" || rollback_status=1
          rollback "${WORKER_APP_NAME}" "${PREVIOUS_WORKER_REVISION}" "${PREVIOUS_WORKER_IMAGE}" || rollback_status=1
          exit "${rollback_status}"
