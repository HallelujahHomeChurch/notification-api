name: Production Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - infra/**
      - scripts/**
  workflow_dispatch:
    inputs:
      fail_openapi_before_pointer:
        description: Test last-good API docs pointer preservation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: notification-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notification_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d notification_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/notification_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan dependencies
        run: |
          trivy_cache="$RUNNER_TEMP/trivy-cache"
          mkdir -p "$trivy_cache"
          echo "TRIVY_CACHE=$trivy_cache" >> "$GITHUB_ENV"
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -v "$trivy_cache:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs /workspace/.git --skip-dirs /workspace/node_modules /workspace

      - name: Verify
        run: |
          go test ./...
          go test -tags=integration ./... -count=1
          go vet ./...
          bash scripts/release-static.test.sh
      - name: Build image
        run: docker build -t notification-api:verify .
      - name: Scan image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$TRIVY_CACHE:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 notification-api:verify

  plan:
    name: Build and plan
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    env:
      ACR_NAME: alive
      ACR_LOGIN_SERVER: alive.azurecr.io
      IMAGE_REPOSITORY: alive/notification-api
      RESOURCE_GROUP: alive
      API_APP_NAME: notification-api
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      SMTP_ADDR: ${{ vars.SMTP_ADDR }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      SMTP_AUTHENTICATION_ENABLED: ${{ vars.SMTP_AUTHENTICATION_ENABLED }}
      VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
      NOTIFICATION_TEMPLATE_DAILY_LIMIT: ${{ vars.NOTIFICATION_TEMPLATE_DAILY_LIMIT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load production release settings
        shell: bash
        run: |
          source infra/production-release.env
          {
            echo "NOTIFICATION_VAULT_NAME=${NOTIFICATION_VAULT_NAME}"
            echo "ACTIVE_ENCRYPTION_KEY_ID=${ACTIVE_ENCRYPTION_KEY_ID}"
            echo "ACTIVE_HASH_KEY_ID=${ACTIVE_HASH_KEY_ID}"
          } >> "${GITHUB_ENV}"

      - name: Validate release configuration
        shell: bash
        run: |
          required_vars=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            SMTP_ADDR
            SMTP_FROM
            SMTP_AUTHENTICATION_ENABLED
            VAPID_PUBLIC_KEY
            VAPID_SUBJECT
            NOTIFICATION_TEMPLATE_DAILY_LIMIT
            NOTIFICATION_VAULT_NAME
            ACTIVE_ENCRYPTION_KEY_ID
            ACTIVE_HASH_KEY_ID
          )
          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required repository variable: ${name}" >&2
              exit 1
            fi
          done
          case "${SMTP_AUTHENTICATION_ENABLED}" in
            true|false) ;;
            *)
              echo "SMTP_AUTHENTICATION_ENABLED must be true or false" >&2
              exit 1
              ;;
          esac
          if ! [[ "${NOTIFICATION_TEMPLATE_DAILY_LIMIT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "NOTIFICATION_TEMPLATE_DAILY_LIMIT must be a positive integer" >&2
            exit 1
          fi
          for name in ACTIVE_ENCRYPTION_KEY_ID ACTIVE_HASH_KEY_ID; do
            if ! [[ "${!name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "${name} contains an invalid key ID" >&2
              exit 1
            fi
          done

      - name: Set image tag
        shell: bash
        run: echo "IMAGE_TAG=main-${GITHUB_SHA::7}" >> "${GITHUB_ENV}"

      - name: Sign in to Azure with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Verify dedicated secret scope
        run: bash scripts/verify-secret-scope.sh

      - name: Build image and resolve digest
        id: image
        shell: bash
        run: |
          az acr build \
            --registry "${ACR_NAME}" \
            --image "${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            --file Dockerfile \
            .
          image_digest="$(az acr repository show \
            --name "${ACR_NAME}" \
            --image "${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            --query digest \
            --output tsv \
            --only-show-errors)"
          if ! [[ "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ACR returned an invalid image digest: ${image_digest}" >&2
            exit 1
          fi
          image_ref="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}@${image_digest}"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"
          echo "IMAGE_REF=${image_ref}" >> "${GITHUB_ENV}"
          echo "IMAGE_DIGEST=${image_digest}" >> "${GITHUB_ENV}"

      - name: Scan immutable image
        shell: bash
        run: |
          trivy_cache="${RUNNER_TEMP}/trivy-cache"
          report="${RUNNER_TEMP}/trivy-notification-api.json"
          trap '[[ ! -e "${report}" ]] || unlink "${report}"' EXIT
          mkdir -p "${trivy_cache}"
          az acr login --name "${ACR_NAME}" --only-show-errors
          docker pull "${IMAGE_REF}"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${trivy_cache}:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${IMAGE_REF}"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${trivy_cache}:/root/.cache/trivy" \
            -v "${RUNNER_TEMP}:/evidence" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --severity HIGH,CRITICAL --format json \
            --output /evidence/trivy-notification-api.json "${IMAGE_REF}"
          fixable="$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity == "HIGH" or .Severity == "CRITICAL") and (.FixedVersion // "") != "")] | unique_by(.VulnerabilityID,.PkgName,.InstalledVersion,.FixedVersion) | length' "${report}")"
          unfixed="$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity == "HIGH" or .Severity == "CRITICAL") and (.FixedVersion // "") == "")] | unique_by(.VulnerabilityID,.PkgName,.InstalledVersion) | length' "${report}")"
          {
            echo '### Trivy image summary'
            echo '- Scanner: `ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969`'
            echo "- Artifact: \`${IMAGE_REF}\`"
            echo "- Fixable High/Critical: ${fixable}"
            echo "- Unfixed High/Critical: ${unfixed}"
            docker run --rm -v "${trivy_cache}:/root/.cache/trivy" \
              ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              version --format json | jq -r '"- Trivy: " + .Version, "- Vulnerability DB updated: " + .VulnerabilityDB.UpdatedAt'
          } >> "${GITHUB_STEP_SUMMARY}"
          [[ "${fixable}" -eq 0 ]]

      - name: Read current release state
        shell: bash
        run: |
          notifications_disabled="$(az containerapp show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${API_APP_NAME}" \
            --query "properties.template.containers[0].env[?name=='NOTIFICATIONS_DISABLED'].value | [0]" \
            --output tsv \
            --only-show-errors)"
          notifications_disabled="${notifications_disabled:-false}"
          notifications_disabled="${notifications_disabled,,}"
          case "${notifications_disabled}" in
            true|false) ;;
            *)
              echo "Invalid deployed NOTIFICATIONS_DISABLED value: ${notifications_disabled}" >&2
              exit 1
              ;;
          esac
          echo "NOTIFICATIONS_DISABLED=${notifications_disabled}" >> "${GITHUB_ENV}"

      - name: Produce complete what-if plan
        shell: bash
        run: |
          mkdir -p release-plan
          az deployment group what-if \
            --name "notification-alerts-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/alerts.bicep \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --only-show-errors \
            --output json > release-plan/alerts-what-if.json
          az deployment group what-if \
            --name "notification-main-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/main.bicep \
            --result-format FullResourcePayloads \
            --parameters \
              imageDigest="${IMAGE_DIGEST}" \
              notificationVaultName="${NOTIFICATION_VAULT_NAME}" \
              deployRuntime=true \
              provisionPermissions=false \
              smtpAddr="${SMTP_ADDR}" \
              smtpFrom="${SMTP_FROM}" \
              smtpAuthenticationEnabled="${SMTP_AUTHENTICATION_ENABLED}" \
              vapidPublicKey="${VAPID_PUBLIC_KEY}" \
              vapidSubject="${VAPID_SUBJECT}" \
              notificationTemplateDailyLimit="${NOTIFICATION_TEMPLATE_DAILY_LIMIT}" \
              notificationsDisabled="${NOTIFICATIONS_DISABLED}" \
              activeEncryptionKeyID="${ACTIVE_ENCRYPTION_KEY_ID}" \
              activeHashKeyID="${ACTIVE_HASH_KEY_ID}" \
            --no-pretty-print \
            --only-show-errors \
            --output json > release-plan/main-what-if.json
          printf '%s\n' "${IMAGE_REF}" > release-plan/image-ref.txt

      - name: Upload release plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notification-release-plan-${{ github.sha }}
          path: release-plan
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Migrate and deploy
    needs: plan
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      commit: ${{ steps.release_outputs.outputs.commit }}
      image: ${{ steps.release_outputs.outputs.image }}
    env:
      IMAGE_REF: ${{ needs.plan.outputs.image_ref }}
      RESOURCE_GROUP: alive
      MIGRATION_JOB_NAME: notification-migrate
      API_APP_NAME: notification-api
      WORKER_APP_NAME: notification-worker
      API_GATEWAY_APP_NAME: api-gateway
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      SMTP_ADDR: ${{ vars.SMTP_ADDR }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      SMTP_AUTHENTICATION_ENABLED: ${{ vars.SMTP_AUTHENTICATION_ENABLED }}
      VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
      NOTIFICATION_TEMPLATE_DAILY_LIMIT: ${{ vars.NOTIFICATION_TEMPLATE_DAILY_LIMIT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load production release settings
        shell: bash
        run: |
          source infra/production-release.env
          {
            echo "NOTIFICATION_VAULT_NAME=${NOTIFICATION_VAULT_NAME}"
            echo "ACTIVE_ENCRYPTION_KEY_ID=${ACTIVE_ENCRYPTION_KEY_ID}"
            echo "ACTIVE_HASH_KEY_ID=${ACTIVE_HASH_KEY_ID}"
          } >> "${GITHUB_ENV}"

      - name: Validate release configuration
        shell: bash
        run: |
          required_vars=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            SMTP_ADDR
            SMTP_FROM
            SMTP_AUTHENTICATION_ENABLED
            VAPID_PUBLIC_KEY
            VAPID_SUBJECT
            NOTIFICATION_TEMPLATE_DAILY_LIMIT
            NOTIFICATION_VAULT_NAME
            ACTIVE_ENCRYPTION_KEY_ID
            ACTIVE_HASH_KEY_ID
            IMAGE_REF
          )
          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required release value: ${name}" >&2
              exit 1
            fi
          done
          case "${SMTP_AUTHENTICATION_ENABLED}" in
            true|false) ;;
            *)
              echo "SMTP_AUTHENTICATION_ENABLED must be true or false" >&2
              exit 1
              ;;
          esac
          if ! [[ "${NOTIFICATION_TEMPLATE_DAILY_LIMIT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "NOTIFICATION_TEMPLATE_DAILY_LIMIT must be a positive integer" >&2
            exit 1
          fi
          if ! [[ "${IMAGE_REF}" =~ ^alive\.azurecr\.io/alive/notification-api@sha256:[0-9a-f]{64}$ ]]; then
            echo "IMAGE_REF must be the planned notification-api ACR digest" >&2
            exit 1
          fi
          for name in ACTIVE_ENCRYPTION_KEY_ID ACTIVE_HASH_KEY_ID; do
            if ! [[ "${!name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "${name} contains an invalid key ID" >&2
              exit 1
            fi
          done
          echo "IMAGE_DIGEST=${IMAGE_REF##*@}" >> "${GITHUB_ENV}"

      - name: Sign in to Azure with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Verify dedicated secret scope
        run: bash scripts/verify-secret-scope.sh

      - name: Capture runtime state and preflight monitoring
        shell: bash
        run: |
          previous_api_revision="$(az containerapp show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${API_APP_NAME}" \
            --query "properties.latestReadyRevisionName" \
            --output tsv \
            --only-show-errors)"
          previous_worker_revision="$(az containerapp show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${WORKER_APP_NAME}" \
            --query "properties.latestReadyRevisionName" \
            --output tsv \
            --only-show-errors)"
          previous_api_image="$(az containerapp revision show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${API_APP_NAME}" \
            --revision "${previous_api_revision}" \
            --query "properties.template.containers[0].image" \
            --output tsv \
            --only-show-errors)"
          previous_worker_image="$(az containerapp revision show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${WORKER_APP_NAME}" \
            --revision "${previous_worker_revision}" \
            --query "properties.template.containers[0].image" \
            --output tsv \
            --only-show-errors)"
          notifications_disabled="$(az containerapp show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${API_APP_NAME}" \
            --query "properties.template.containers[0].env[?name=='NOTIFICATIONS_DISABLED'].value | [0]" \
            --output tsv \
            --only-show-errors)"
          notifications_disabled="${notifications_disabled:-false}"
          notifications_disabled="${notifications_disabled,,}"
          if [[ -z "${previous_api_revision}" || -z "${previous_worker_revision}" || -z "${previous_api_image}" || -z "${previous_worker_image}" ]]; then
            echo "Unable to capture current Ready revisions" >&2
            exit 1
          fi
          case "${notifications_disabled}" in
            false) ;;
            true)
              echo "NOTIFICATIONS_DISABLED=true; refusing to release during an active notification incident" >&2
              exit 1
              ;;
            *)
              echo "Invalid deployed NOTIFICATIONS_DISABLED value: ${notifications_disabled}" >&2
              exit 1
              ;;
          esac
          az monitor action-group show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "RecommendedAlertRules-AG-1" \
            --only-show-errors \
            --output none
          {
            echo "PREVIOUS_API_REVISION=${previous_api_revision}"
            echo "PREVIOUS_WORKER_REVISION=${previous_worker_revision}"
            echo "PREVIOUS_API_IMAGE=${previous_api_image}"
            echo "PREVIOUS_WORKER_IMAGE=${previous_worker_image}"
            echo "NOTIFICATIONS_DISABLED=${notifications_disabled}"
          } >> "${GITHUB_ENV}"

      - name: Re-run complete what-if
        shell: bash
        run: |
          az deployment group what-if \
            --name "notification-alerts-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/alerts.bicep \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --only-show-errors \
            --output none
          az deployment group what-if \
            --name "notification-main-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/main.bicep \
            --result-format FullResourcePayloads \
            --parameters \
              imageDigest="${IMAGE_DIGEST}" \
              notificationVaultName="${NOTIFICATION_VAULT_NAME}" \
              deployRuntime=true \
              provisionPermissions=false \
              smtpAddr="${SMTP_ADDR}" \
              smtpFrom="${SMTP_FROM}" \
              smtpAuthenticationEnabled="${SMTP_AUTHENTICATION_ENABLED}" \
              vapidPublicKey="${VAPID_PUBLIC_KEY}" \
              vapidSubject="${VAPID_SUBJECT}" \
              notificationTemplateDailyLimit="${NOTIFICATION_TEMPLATE_DAILY_LIMIT}" \
              notificationsDisabled="${NOTIFICATIONS_DISABLED}" \
              activeEncryptionKeyID="${ACTIVE_ENCRYPTION_KEY_ID}" \
              activeHashKeyID="${ACTIVE_HASH_KEY_ID}" \
            --no-pretty-print \
            --only-show-errors \
            --output none

      - name: Deploy alerts
        shell: bash
        run: |
          az deployment group create \
            --name "notification-alerts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/alerts.bicep \
            --only-show-errors \
            --output none

      - name: Update migration job
        shell: bash
        run: |
          az deployment group create \
            --name "notification-migrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/main.bicep \
            --parameters \
              imageDigest="${IMAGE_DIGEST}" \
              notificationVaultName="${NOTIFICATION_VAULT_NAME}" \
              deployRuntime=false \
              provisionPermissions=false \
              smtpAddr="${SMTP_ADDR}" \
              smtpFrom="${SMTP_FROM}" \
              smtpAuthenticationEnabled="${SMTP_AUTHENTICATION_ENABLED}" \
              vapidPublicKey="${VAPID_PUBLIC_KEY}" \
              vapidSubject="${VAPID_SUBJECT}" \
              notificationTemplateDailyLimit="${NOTIFICATION_TEMPLATE_DAILY_LIMIT}" \
              notificationsDisabled="${NOTIFICATIONS_DISABLED}" \
              activeEncryptionKeyID="${ACTIVE_ENCRYPTION_KEY_ID}" \
              activeHashKeyID="${ACTIVE_HASH_KEY_ID}" \
            --only-show-errors \
            --output none

      - name: Run migrations
        shell: bash
        run: |
          execution_name="$(az containerapp job start \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${MIGRATION_JOB_NAME}" \
            --query name \
            --output tsv \
            --only-show-errors)"
          if [[ -z "${execution_name}" ]]; then
            echo "Migration job did not return an execution name" >&2
            exit 1
          fi

          for attempt in {1..60}; do
            status="$(az containerapp job execution list \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${MIGRATION_JOB_NAME}" \
              --query "[?name=='${execution_name}'].properties.status | [0]" \
              --output tsv \
              --only-show-errors)"
            case "${status}" in
              Succeeded)
                echo "Migration execution ${execution_name} succeeded"
                exit 0
                ;;
              Failed|Canceled|Cancelled|Stopped)
                echo "Migration execution ${execution_name} ended with ${status}" >&2
                exit 1
                ;;
            esac
            echo "Waiting for migration execution ${execution_name}: ${status:-Pending} (${attempt}/60)"
            sleep 10
          done

          echo "Migration execution ${execution_name} did not succeed before timeout" >&2
          exit 1

      - name: Deploy API and worker
        id: deploy_runtime
        shell: bash
        run: |
          az deployment group create \
            --name "notification-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/main.bicep \
            --parameters \
              imageDigest="${IMAGE_DIGEST}" \
              notificationVaultName="${NOTIFICATION_VAULT_NAME}" \
              deployRuntime=true \
              provisionPermissions=false \
              smtpAddr="${SMTP_ADDR}" \
              smtpFrom="${SMTP_FROM}" \
              smtpAuthenticationEnabled="${SMTP_AUTHENTICATION_ENABLED}" \
              vapidPublicKey="${VAPID_PUBLIC_KEY}" \
              vapidSubject="${VAPID_SUBJECT}" \
              notificationTemplateDailyLimit="${NOTIFICATION_TEMPLATE_DAILY_LIMIT}" \
              notificationsDisabled="${NOTIFICATIONS_DISABLED}" \
              activeEncryptionKeyID="${ACTIVE_ENCRYPTION_KEY_ID}" \
              activeHashKeyID="${ACTIVE_HASH_KEY_ID}" \
            --only-show-errors \
            --output none

      - name: Wait for API and worker revisions
        id: wait_runtime
        shell: bash
        run: |
          image_ref="${IMAGE_REF}"
          wait_for_revision() {
            local app_name="$1"
            for attempt in {1..60}; do
              state="$(az containerapp show \
                --resource-group "${RESOURCE_GROUP}" \
                --name "${app_name}" \
                --query "join('|', [properties.latestRevisionName, properties.latestReadyRevisionName])" \
                --output tsv \
                --only-show-errors)"
              IFS='|' read -r latest ready <<< "${state}"
              deployed_image=""
              if [[ -n "${latest}" && "${latest}" == "${ready}" ]]; then
                deployed_image="$(az containerapp revision show \
                  --resource-group "${RESOURCE_GROUP}" \
                  --name "${app_name}" \
                  --revision "${ready}" \
                  --query "properties.template.containers[0].image" \
                  --output tsv \
                  --only-show-errors)"
                if [[ "${deployed_image}" == "${image_ref}" ]]; then
                  echo "${app_name} is ready on ${ready} with ${image_ref}"
                  return 0
                fi
              fi
              echo "Waiting for ${app_name}: latest=${latest:-none} ready=${ready:-none} image=${deployed_image:-none} (${attempt}/60)"
              sleep 10
            done
            echo "${app_name} did not become ready with ${image_ref}" >&2
            return 1
          }

          wait_for_revision "${API_APP_NAME}"
          wait_for_revision "${WORKER_APP_NAME}"

      - name: Verify Dapr readiness through API gateway
        id: smoke_runtime
        shell: bash
        run: |
          dapr_url="http://localhost:3500/v1.0/invoke/notification-api/method/ready"
          probe_exit=0
          probe_output="$(timeout 60s script -q -e -c \
            "az containerapp exec --resource-group \"${RESOURCE_GROUP}\" --name \"${API_GATEWAY_APP_NAME}\" --command \"/usr/bin/wget -S -O - ${dapr_url}\"" \
            /dev/null 2>&1)" || probe_exit=$?
          probe_output="${probe_output//$'\r'/}"
          printf '%s\n' "${probe_output}"

          if (( probe_exit == 124 )); then
            echo "Dapr readiness probe timed out after 60 seconds" >&2
            exit 1
          fi
          if ! grep -Eq 'HTTP/1\.[01][[:space:]]+200' <<< "${probe_output}"; then
            echo "Dapr readiness probe did not return HTTP 200" >&2
            exit 1
          fi
          if ! grep -Eq '"status"[[:space:]]*:[[:space:]]*"ready"' <<< "${probe_output}"; then
            echo "Dapr readiness probe returned an unexpected body" >&2
            exit 1
          fi
          if (( probe_exit != 0 )); then
            echo "Dapr readiness probe command failed with exit ${probe_exit}" >&2
            exit 1
          fi

      - name: Capture healthy release
        id: release_outputs
        shell: bash
        run: |
          echo "commit=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE_REF}" >> "${GITHUB_OUTPUT}"

      - name: Roll back runtime after failed deployment verification
        if: ${{ failure() && steps.deploy_runtime.outcome != 'skipped' }}
        shell: bash
        run: |
          rollback() {
            local app_name="$1"
            local previous_revision="$2"
            local image_ref="$3"
            az containerapp revision copy \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${app_name}" \
              --from-revision "${previous_revision}" \
              --revision-suffix "rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --only-show-errors \
              --output none
            for attempt in {1..60}; do
              state="$(az containerapp show \
                --resource-group "${RESOURCE_GROUP}" \
                --name "${app_name}" \
                --query "join('|', [properties.latestRevisionName, properties.latestReadyRevisionName])" \
                --output tsv \
                --only-show-errors)"
              IFS='|' read -r latest ready <<< "${state}"
              if [[ -n "${latest}" && "${latest}" == "${ready}" ]]; then
                deployed_image="$(az containerapp revision show \
                  --resource-group "${RESOURCE_GROUP}" \
                  --name "${app_name}" \
                  --revision "${ready}" \
                  --query "properties.template.containers[0].image" \
                  --output tsv \
                  --only-show-errors)"
                if [[ "${deployed_image}" == "${image_ref}" ]]; then
                  echo "Rolled back ${app_name} to ${image_ref}"
                  return 0
                fi
              fi
              sleep 10
            done
            echo "Rollback failed for ${app_name}" >&2
            return 1
          }

          rollback_status=0
          rollback "${API_APP_NAME}" "${PREVIOUS_API_REVISION}" "${PREVIOUS_API_IMAGE}" || rollback_status=1
          rollback "${WORKER_APP_NAME}" "${PREVIOUS_WORKER_REVISION}" "${PREVIOUS_WORKER_IMAGE}" || rollback_status=1
          exit "${rollback_status}"

  publish_openapi:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      STORAGE_ACCOUNT: hhcapidocsprod
      CONTAINER: api-docs-notification-api
      API_DOCS_AZURE_CLIENT_ID: ${{ vars.API_DOCS_AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RELEASE_COMMIT: ${{ needs.deploy.outputs.commit }}
      RELEASE_IMAGE: ${{ needs.deploy.outputs.image }}
      FAIL_OPENAPI_BEFORE_POINTER: ${{ inputs.fail_openapi_before_pointer && github.run_attempt == 1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate publication configuration
        shell: bash
        run: |
          [[ "${RELEASE_COMMIT}" == "${GITHUB_SHA}" ]]
          [[ "${RELEASE_IMAGE}" == alive.azurecr.io/alive/notification-api@sha256:* ]]
          for name in API_DOCS_AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            test -n "${!name:-}" || { echo "Missing repository variable: ${name}" >&2; exit 1; }
          done
      - name: Sign in with API docs publisher identity
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.API_DOCS_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish production OpenAPI contract
        shell: bash
        run: |
          spec_blob="specs/${GITHUB_SHA}/openapi.yaml"
          spec_sha256="$(sha256sum docs/openapi.yaml | cut -d " " -f 1)"
          is_canonical_run_id() { [[ "$1" =~ ^[1-9][0-9]*$ ]]; }
          if ! is_canonical_run_id "${GITHUB_RUN_ID}"; then
            echo "Invalid GITHUB_RUN_ID: expected canonical positive decimal" >&2
            exit 1
          fi
          spec_exists="$(az storage blob exists \
            --account-name "${STORAGE_ACCOUNT}" \
            --container-name "${CONTAINER}" \
            --name "${spec_blob}" \
            --auth-mode login \
            --only-show-errors \
            --query exists \
            --output tsv)"
          if [[ "${spec_exists}" == "true" ]]; then
            existing_spec="$(mktemp)"
            az storage blob download \
              --account-name "${STORAGE_ACCOUNT}" \
              --container-name "${CONTAINER}" \
              --name "${spec_blob}" \
              --file "${existing_spec}" \
              --auth-mode login \
              --no-progress \
              --only-show-errors \
              --output none
            [[ "$(sha256sum "${existing_spec}" | cut -d " " -f 1)" == "${spec_sha256}" ]] || {
              echo "Existing OpenAPI spec hash does not match" >&2
              exit 1
            }
          else
            az storage blob upload \
              --account-name "${STORAGE_ACCOUNT}" \
              --container-name "${CONTAINER}" \
              --name "${spec_blob}" \
              --file docs/openapi.yaml \
              --auth-mode login \
              --overwrite false \
              --only-show-errors \
              --output none
          fi

          jq -n \
            --arg service notification-api \
            --arg commit "${RELEASE_COMMIT}" \
            --arg image "${RELEASE_IMAGE}" \
            --arg specBlob "${spec_blob}" \
            --arg specSha256 "${spec_sha256}" \
            --arg releaseUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, service: $service, commit: $commit, image: $image, specBlob: $specBlob, specSha256: $specSha256, releaseUrl: $releaseUrl, publishedAt: $publishedAt}' \
            > current.json

          if [[ "${FAIL_OPENAPI_BEFORE_POINTER}" == "true" ]]; then
            echo "Requested failure before API docs pointer upload" >&2
            exit 1
          fi

          pointer_exists="$(az storage blob exists \
            --account-name "${STORAGE_ACCOUNT}" \
            --container-name "${CONTAINER}" \
            --name current.json \
            --auth-mode login \
            --only-show-errors \
            --query exists \
            --output tsv)"
          if [[ "${pointer_exists}" == "true" ]]; then
            current_pointer="$(mktemp)"
            az storage blob download \
              --account-name "${STORAGE_ACCOUNT}" \
              --container-name "${CONTAINER}" \
              --name current.json \
              --file "${current_pointer}" \
              --auth-mode login \
              --no-progress \
              --only-show-errors \
              --output none
            current_run_id="$(jq -er --arg release_url_prefix "https://github.com/${GITHUB_REPOSITORY}/actions/runs/" '
              .releaseUrl? as $release_url
              | if ($release_url | type) == "string" and ($release_url | startswith($release_url_prefix))
                then ($release_url | ltrimstr($release_url_prefix))
                else empty
                end
            ' "${current_pointer}" 2>/dev/null)" || {
              echo "Invalid existing API docs pointer: expected canonical GitHub workflow run ID" >&2
              exit 1
            }
            if ! is_canonical_run_id "${current_run_id}"; then
              echo "Invalid existing API docs pointer: expected canonical GitHub workflow run ID" >&2
              exit 1
            fi
            export LC_ALL=C
            if [[ ${#current_run_id} -gt ${#GITHUB_RUN_ID} ]] || { [[ ${#current_run_id} -eq ${#GITHUB_RUN_ID} ]] && [[ "${current_run_id}" > "${GITHUB_RUN_ID}" || "${current_run_id}" == "${GITHUB_RUN_ID}" ]]; }; then
              echo "API docs pointer already belongs to workflow run ${current_run_id}; skipping stale or rerun publication"
              exit 0
            fi
          fi

          az storage blob upload \
            --account-name "${STORAGE_ACCOUNT}" \
            --container-name "${CONTAINER}" \
            --name current.json \
            --file current.json \
            --auth-mode login \
            --overwrite true \
            --only-show-errors \
            --output none
