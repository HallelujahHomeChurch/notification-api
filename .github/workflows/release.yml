name: Production Release

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - infra/**
      - scripts/**
      - '!scripts/engagement_status_release.py'
      - '!scripts/test-engagement-status-release.py'
      - '!scripts/release-static.test.sh'
      - docs/data-governance.yaml
  workflow_dispatch:
    inputs:
      status_transition:
        description: Notification private status listener transition (enable or disable)
        type: string
      status_version:
        description: Pinned Key Vault secret version for enable
        type: string
      status_expected_revision:
        description: Exact serving Notification API revision
        type: string
      status_source_release_run:
        description: Successful original owner release for the serving image
        type: string
      status_reviewed_plan:
        description: Exact reviewed preview fingerprint, empty for preview
        type: string
      retire_dapr_revisions:
        description: Exact serving Notification API, Account and Engagement HTTPS revisions, in that order separated by spaces
        type: string
      recovery_run:
        description: Failed owner run that verified and published its image before capture failed
        type: string
      recovery_image_digest:
        description: Exact sha256 image digest already published by the failed owner run
        type: string
      fail_openapi_before_pointer:
        description: Test last-good API docs pointer preservation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: notification-production
  cancel-in-progress: false

jobs:
  status_configuration:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.status_transition != '' || inputs.retire_dapr_revisions != '') && inputs.recovery_run == '' && inputs.recovery_image_digest == '' && vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_TRANSITION: ${{ inputs.status_transition }}
      STATUS_VERSION: ${{ inputs.status_version }}
      STATUS_EXPECTED_REVISION: ${{ inputs.status_expected_revision }}
      STATUS_SOURCE_RELEASE_RUN: ${{ inputs.status_source_release_run }}
      STATUS_REVIEWED_PLAN: ${{ inputs.status_reviewed_plan }}
      RETIRE_DAPR_REVISIONS: ${{ inputs.retire_dapr_revisions }}
      NOTIFICATION_ACCOUNT_PRIVATE_SECRET_VERSION: ${{ vars.NOTIFICATION_ACCOUNT_PRIVATE_SECRET_VERSION }}
      NOTIFICATION_ENGAGEMENT_SEND_SECRET_VERSION: ${{ vars.NOTIFICATION_ENGAGEMENT_SEND_SECRET_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate owner workflow
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ -z "$RETIRE_DAPR_REVISIONS" || -z "$STATUS_TRANSITION$STATUS_VERSION$STATUS_EXPECTED_REVISION$STATUS_SOURCE_RELEASE_RUN$STATUS_REVIEWED_PLAN" ]]
          python3 scripts/test-engagement-status-release.py
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az extension add --name containerapp --upgrade --yes
      - name: Apply the requested owner configuration action
        run: |
          if [[ -n "$RETIRE_DAPR_REVISIONS" ]]; then
            python3 scripts/engagement_status_release.py retire-dapr
          else
            python3 scripts/engagement_status_release.py transition
          fi

  verify:
    name: Verify
    if: >-
      ${{ inputs.status_transition == '' && inputs.retire_dapr_revisions == '' && inputs.recovery_run == '' && inputs.recovery_image_digest == '' &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        github.event.before == '35291a168d9119de13ebaad0aded69f92b8683b2' &&
        startsWith(format('{0}{1}', github.event.head_commit.message, fromJSON('"\n"')),
          format('Repair Notification retirement checks without rebuilding [notification-86]{0}', fromJSON('"\n"')))) }}
    outputs:
      image_artifact_id: ${{ steps.image_artifact.outputs.artifact-id }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notification_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d notification_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/notification_test?sslmode=disable
      DB_PHASE_TEST_DSN: postgres://postgres:postgres@localhost:5432/notification_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan dependencies
        run: |
          trivy_cache="$RUNNER_TEMP/trivy-cache"
          mkdir -p "$trivy_cache"
          echo "TRIVY_CACHE=$trivy_cache" >> "$GITHUB_ENV"
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            -v "$trivy_cache:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs /workspace/.git --skip-dirs /workspace/node_modules /workspace

      - name: Verify
        run: |
          mkdir -p .artifacts/data-governance
          set -o pipefail
          go test -p 1 -tags=integration -json ./... -count=1 | tee .artifacts/data-governance/test-events.jsonl
          GOVERNANCE_TEST_EVENTS="$PWD/.artifacts/data-governance/test-events.jsonl" \
          GOVERNANCE_OUTPUT_DIR="$PWD/.artifacts/data-governance/export" \
            go test ./internal/governance -run '^TestDataGovernanceExport$' -count=1
          bash scripts/test-publish-data-governance.sh
          go vet ./...
          bash scripts/release-static.test.sh
          bash scripts/test-release-image-artifact.sh
      - name: Build image
        run: docker build --platform linux/amd64 -t notification-api:verify .
      - name: Scan image
        run: sh scripts/scan-image.sh notification-api:verify
      - name: Export verified image
        run: bash scripts/release-image-artifact.sh pack "$RUNNER_TEMP/release-image" "$GITHUB_SHA" notification-api:verify
      - name: Store verified image
        id: image_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notification-image-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-image
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Store verified governance manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-governance-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          path: |
            .artifacts/data-governance/export/data-governance.yaml
            .artifacts/data-governance/export/data-governance.json

  plan:
    name: Build and plan
    needs: verify
    if: ${{ !cancelled() && (needs.verify.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.status_transition == '' && inputs.retire_dapr_revisions == '' && (inputs.recovery_run != '' || inputs.recovery_image_digest != '') && needs.verify.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      actions: read
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
      source_commit: ${{ steps.source.outputs.commit }}
      source_run: ${{ steps.source.outputs.run }}
    env:
      ACR_NAME: alive
      ACR_LOGIN_SERVER: alive.azurecr.io
      IMAGE_REPOSITORY: alive/notification-api
      RESOURCE_GROUP: alive
      API_APP_NAME: notification-api
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      SES_FEEDBACK_CONFIG: ${{ vars.SES_FEEDBACK_CONFIG || 'null' }}
      SMTP_ADDR: ${{ vars.SMTP_ADDR }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      SMTP_AUTHENTICATION_ENABLED: ${{ vars.SMTP_AUTHENTICATION_ENABLED }}
      VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
      NOTIFICATION_TEMPLATE_DAILY_LIMIT: ${{ vars.NOTIFICATION_TEMPLATE_DAILY_LIMIT }}
      NOTIFICATION_WORKER_ELIGIBILITY_SECRET_VERSION: ${{ vars.NOTIFICATION_WORKER_ELIGIBILITY_SECRET_VERSION }}
      NOTIFICATION_ACCOUNT_PRIVATE_SECRET_VERSION: ${{ vars.NOTIFICATION_ACCOUNT_PRIVATE_SECRET_VERSION }}
      NOTIFICATION_ENGAGEMENT_SEND_SECRET_VERSION: ${{ vars.NOTIFICATION_ENGAGEMENT_SEND_SECRET_VERSION }}
      RECOVERY_RUN: ${{ inputs.recovery_run }}
      RECOVERY_IMAGE_DIGEST: ${{ inputs.recovery_image_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Load production release settings
        shell: bash
        run: |
          source infra/production-release.env
          {
            echo "NOTIFICATION_VAULT_NAME=${NOTIFICATION_VAULT_NAME}"
            echo "ACTIVE_ENCRYPTION_KEY_ID=${ACTIVE_ENCRYPTION_KEY_ID}"
            echo "ACTIVE_HASH_KEY_ID=${ACTIVE_HASH_KEY_ID}"
          } >> "${GITHUB_ENV}"

      - name: Validate release configuration
        shell: bash
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Production release is allowed only from refs/heads/main" >&2; exit 1; }
          [[ "${NOTIFICATION_WORKER_ELIGIBILITY_SECRET_VERSION}" =~ ^[0-9a-f]{32}$ ]] ||
            { echo "Pinned Notification worker eligibility secret version is required" >&2; exit 1; }
          required_vars=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            SMTP_ADDR
            SMTP_FROM
            SMTP_AUTHENTICATION_ENABLED
            VAPID_PUBLIC_KEY
            VAPID_SUBJECT
            NOTIFICATION_TEMPLATE_DAILY_LIMIT
            NOTIFICATION_VAULT_NAME
            ACTIVE_ENCRYPTION_KEY_ID
            ACTIVE_HASH_KEY_ID
          )
          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required repository variable: ${name}" >&2
              exit 1
            fi
          done
          case "${SMTP_AUTHENTICATION_ENABLED}" in
            true|false) ;;
            *)
              echo "SMTP_AUTHENTICATION_ENABLED must be true or false" >&2
              exit 1
              ;;
          esac
          if ! [[ "${NOTIFICATION_TEMPLATE_DAILY_LIMIT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "NOTIFICATION_TEMPLATE_DAILY_LIMIT must be a positive integer" >&2
            exit 1
          fi
          for name in ACTIVE_ENCRYPTION_KEY_ID ACTIVE_HASH_KEY_ID; do
            if ! [[ "${!name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "${name} contains an invalid key ID" >&2
              exit 1
            fi
          done

      - name: Verify immutable release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/engagement_status_release.py release-source

      - name: Set image tag
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: echo "IMAGE_TAG=main-${SOURCE_COMMIT::7}" >> "${GITHUB_ENV}"

      - name: Sign in to Azure with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Verify dedicated secret scope
        run: bash scripts/verify-secret-scope.sh

      - name: Require verified artifact ID
        if: inputs.recovery_run == ''
        env:
          IMAGE_ARTIFACT_ID: ${{ needs.verify.outputs.image_artifact_id }}
        run: '[[ "$IMAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - name: Download verified image
        if: inputs.recovery_run == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.image_artifact_id }}
          path: ${{ runner.temp }}/release-image
          merge-multiple: true
          digest-mismatch: error
      - name: Download original verified image for recovery
        if: inputs.recovery_run != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.source.outputs.image_artifact }}
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-image
          digest-mismatch: error
      - name: Verify and load image
        id: load_image
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: bash scripts/release-image-artifact.sh load "$RUNNER_TEMP/release-image" "$SOURCE_COMMIT"
      - name: Resolve verified image digest
        id: image
        shell: bash
        run: |
          az acr login --name "${ACR_NAME}" --only-show-errors
          if [[ -z "$RECOVERY_RUN" ]]; then
            docker tag notification-api:verify "${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"
            docker push "${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          fi
          image_digest="$(az acr repository show \
            --name "${ACR_NAME}" \
            --image "${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            --query digest \
            --output tsv \
            --only-show-errors)"
          if ! [[ "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ACR returned an invalid image digest: ${image_digest}" >&2
            exit 1
          fi
          [[ -z "$RECOVERY_RUN" || "$image_digest" == "$RECOVERY_IMAGE_DIGEST" ]]
          image_ref="${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}@${image_digest}"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"
          echo "IMAGE_REF=${image_ref}" >> "${GITHUB_ENV}"
          echo "IMAGE_DIGEST=${image_digest}" >> "${GITHUB_ENV}"

      - name: Verify published image identity
        shell: bash
        run: |
          az acr login --name "${ACR_NAME}" --only-show-errors
          docker pull --platform linux/amd64 "${IMAGE_REF}"
          [[ "$(docker image inspect --format '{{.Id}}' "${IMAGE_REF}")" == "${{ steps.load_image.outputs.api_image_id }}" ]]
          [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${IMAGE_REF}")" == "linux/amd64" ]]

      - name: Read current release state
        shell: bash
        run: |
          notifications_disabled="$(az containerapp show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${API_APP_NAME}" \
            --query "properties.template.containers[0].env[?name=='NOTIFICATIONS_DISABLED'].value | [0]" \
            --output tsv \
            --only-show-errors)"
          notifications_disabled="${notifications_disabled:-false}"
          notifications_disabled="${notifications_disabled,,}"
          case "${notifications_disabled}" in
            true|false) ;;
            *)
              echo "Invalid deployed NOTIFICATIONS_DISABLED value: ${notifications_disabled}" >&2
              exit 1
              ;;
          esac
          echo "NOTIFICATIONS_DISABLED=${notifications_disabled}" >> "${GITHUB_ENV}"
          python3 scripts/engagement_status_release.py capture

      - name: Produce complete what-if plan
        shell: bash
        run: |
          mkdir -p release-plan
          az deployment group what-if \
            --name "notification-alerts-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/alerts.bicep \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --only-show-errors \
            --output json > release-plan/alerts-what-if.json
          az deployment group what-if \
            --name "notification-main-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/main.bicep \
            --result-format FullResourcePayloads \
            --parameters \
              imageDigest="${IMAGE_DIGEST}" \
              notificationVaultName="${NOTIFICATION_VAULT_NAME}" \
              deployRuntime=true \
              workerEligibilityVersion="${NOTIFICATION_WORKER_ELIGIBILITY_SECRET_VERSION}" \
              apiDaprEnabled="${API_DAPR_ENABLED}" \
              engagementStatusEnabled="${ENGAGEMENT_STATUS_ENABLED}" \
              engagementStatusVersion="${ENGAGEMENT_STATUS_VERSION}" \
              accountPrivateVersion="${NOTIFICATION_ACCOUNT_PRIVATE_SECRET_VERSION}" \
              engagementSendVersion="${NOTIFICATION_ENGAGEMENT_SEND_SECRET_VERSION}" \
              provisionPermissions=false \
              smtpAddr="${SMTP_ADDR}" \
              smtpFrom="${SMTP_FROM}" \
              smtpAuthenticationEnabled="${SMTP_AUTHENTICATION_ENABLED}" \
              vapidPublicKey="${VAPID_PUBLIC_KEY}" \
              vapidSubject="${VAPID_SUBJECT}" \
              notificationTemplateDailyLimit="${NOTIFICATION_TEMPLATE_DAILY_LIMIT}" \
              notificationsDisabled="${NOTIFICATIONS_DISABLED}" \
              sesFeedback="${SES_FEEDBACK_CONFIG}" \
              activeEncryptionKeyID="${ACTIVE_ENCRYPTION_KEY_ID}" \
              activeHashKeyID="${ACTIVE_HASH_KEY_ID}" \
            --no-pretty-print \
            --only-show-errors \
            --output json > release-plan/main-what-if.json
          printf '%s\n' "${IMAGE_REF}" > release-plan/image-ref.txt

      - name: Upload release plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notification-release-plan-${{ github.sha }}
          path: release-plan
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Migrate and deploy
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      commit: ${{ steps.release_outputs.outputs.commit }}
      image: ${{ steps.release_outputs.outputs.image }}
    env:
      IMAGE_REF: ${{ needs.plan.outputs.image_ref }}
      RELEASE_COMMIT: ${{ needs.plan.outputs.source_commit }}
      RESOURCE_GROUP: alive
      MIGRATION_JOB_NAME: notification-migrate
      API_APP_NAME: notification-api
      WORKER_APP_NAME: notification-worker
      API_GATEWAY_APP_NAME: api-gateway
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      SES_FEEDBACK_CONFIG: ${{ vars.SES_FEEDBACK_CONFIG || 'null' }}
      SMTP_ADDR: ${{ vars.SMTP_ADDR }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      SMTP_AUTHENTICATION_ENABLED: ${{ vars.SMTP_AUTHENTICATION_ENABLED }}
      VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
      NOTIFICATION_TEMPLATE_DAILY_LIMIT: ${{ vars.NOTIFICATION_TEMPLATE_DAILY_LIMIT }}
      NOTIFICATION_WORKER_ELIGIBILITY_SECRET_VERSION: ${{ vars.NOTIFICATION_WORKER_ELIGIBILITY_SECRET_VERSION }}
      NOTIFICATION_ACCOUNT_PRIVATE_SECRET_VERSION: ${{ vars.NOTIFICATION_ACCOUNT_PRIVATE_SECRET_VERSION }}
      NOTIFICATION_ENGAGEMENT_SEND_SECRET_VERSION: ${{ vars.NOTIFICATION_ENGAGEMENT_SEND_SECRET_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load production release settings
        shell: bash
        run: |
          source infra/production-release.env
          {
            echo "NOTIFICATION_VAULT_NAME=${NOTIFICATION_VAULT_NAME}"
            echo "ACTIVE_ENCRYPTION_KEY_ID=${ACTIVE_ENCRYPTION_KEY_ID}"
            echo "ACTIVE_HASH_KEY_ID=${ACTIVE_HASH_KEY_ID}"
          } >> "${GITHUB_ENV}"

      - name: Validate release configuration
        shell: bash
        run: |
          [[ "${NOTIFICATION_WORKER_ELIGIBILITY_SECRET_VERSION}" =~ ^[0-9a-f]{32}$ ]] ||
            { echo "Pinned Notification worker eligibility secret version is required" >&2; exit 1; }
          required_vars=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            SMTP_ADDR
            SMTP_FROM
            SMTP_AUTHENTICATION_ENABLED
            VAPID_PUBLIC_KEY
            VAPID_SUBJECT
            NOTIFICATION_TEMPLATE_DAILY_LIMIT
            NOTIFICATION_VAULT_NAME
            ACTIVE_ENCRYPTION_KEY_ID
            ACTIVE_HASH_KEY_ID
            IMAGE_REF
          )
          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required release value: ${name}" >&2
              exit 1
            fi
          done
          case "${SMTP_AUTHENTICATION_ENABLED}" in
            true|false) ;;
            *)
              echo "SMTP_AUTHENTICATION_ENABLED must be true or false" >&2
              exit 1
              ;;
          esac
          if ! [[ "${NOTIFICATION_TEMPLATE_DAILY_LIMIT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "NOTIFICATION_TEMPLATE_DAILY_LIMIT must be a positive integer" >&2
            exit 1
          fi
          if ! [[ "${IMAGE_REF}" =~ ^alive\.azurecr\.io/alive/notification-api@sha256:[0-9a-f]{64}$ ]]; then
            echo "IMAGE_REF must be the planned notification-api ACR digest" >&2
            exit 1
          fi
          for name in ACTIVE_ENCRYPTION_KEY_ID ACTIVE_HASH_KEY_ID; do
            if ! [[ "${!name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "${name} contains an invalid key ID" >&2
              exit 1
            fi
          done
          echo "IMAGE_DIGEST=${IMAGE_REF##*@}" >> "${GITHUB_ENV}"

      - name: Sign in to Azure with OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Verify dedicated secret scope
        run: bash scripts/verify-secret-scope.sh

      - name: Capture runtime state and preflight monitoring
        shell: bash
        run: |
          previous_api_revision="$(az containerapp show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${API_APP_NAME}" \
            --query "properties.latestReadyRevisionName" \
            --output tsv \
            --only-show-errors)"
          previous_worker_revision="$(az containerapp show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${WORKER_APP_NAME}" \
            --query "properties.latestReadyRevisionName" \
            --output tsv \
            --only-show-errors)"
          previous_api_image="$(az containerapp revision show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${API_APP_NAME}" \
            --revision "${previous_api_revision}" \
            --query "properties.template.containers[0].image" \
            --output tsv \
            --only-show-errors)"
          previous_worker_image="$(az containerapp revision show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${WORKER_APP_NAME}" \
            --revision "${previous_worker_revision}" \
            --query "properties.template.containers[0].image" \
            --output tsv \
            --only-show-errors)"
          notifications_disabled="$(az containerapp show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${API_APP_NAME}" \
            --query "properties.template.containers[0].env[?name=='NOTIFICATIONS_DISABLED'].value | [0]" \
            --output tsv \
            --only-show-errors)"
          notifications_disabled="${notifications_disabled:-false}"
          notifications_disabled="${notifications_disabled,,}"
          if [[ -z "${previous_api_revision}" || -z "${previous_worker_revision}" || -z "${previous_api_image}" || -z "${previous_worker_image}" ]]; then
            echo "Unable to capture current Ready revisions" >&2
            exit 1
          fi
          case "${notifications_disabled}" in
            false) ;;
            true)
              echo "NOTIFICATIONS_DISABLED=true; refusing to release during an active notification incident" >&2
              exit 1
              ;;
            *)
              echo "Invalid deployed NOTIFICATIONS_DISABLED value: ${notifications_disabled}" >&2
              exit 1
              ;;
          esac
          az monitor action-group show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "RecommendedAlertRules-AG-1" \
            --only-show-errors \
            --output none
          previous_worker_dapr_config="$(az containerapp show -g "${RESOURCE_GROUP}" -n "${WORKER_APP_NAME}" \
            --query properties.configuration.dapr -o json --only-show-errors)"
          previous_worker_dapr="$(jq -r '.enabled' <<< "${previous_worker_dapr_config}")"
          if [[ "${previous_worker_dapr}" == true ]]; then
            jq -e '.appId == "notification-worker" and .appPort == 8081 and .appProtocol == "http" and .logLevel == "warn"' \
              <<< "${previous_worker_dapr_config}" >/dev/null
          else
            [[ "${previous_worker_dapr}" == false ]]
          fi
          {
            echo "PREVIOUS_WORKER_DAPR=${previous_worker_dapr}"
            echo "PREVIOUS_API_REVISION=${previous_api_revision}"
            echo "PREVIOUS_WORKER_REVISION=${previous_worker_revision}"
            echo "PREVIOUS_API_IMAGE=${previous_api_image}"
            echo "PREVIOUS_WORKER_IMAGE=${previous_worker_image}"
            echo "NOTIFICATIONS_DISABLED=${notifications_disabled}"
          } >> "${GITHUB_ENV}"
          python3 scripts/engagement_status_release.py capture

      - name: Re-run complete what-if
        shell: bash
        run: |
          az deployment group what-if \
            --name "notification-alerts-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/alerts.bicep \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            --only-show-errors \
            --output none
          az deployment group what-if \
            --name "notification-main-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/main.bicep \
            --result-format FullResourcePayloads \
            --parameters \
              imageDigest="${IMAGE_DIGEST}" \
              notificationVaultName="${NOTIFICATION_VAULT_NAME}" \
              deployRuntime=true \
              workerEligibilityVersion="${NOTIFICATION_WORKER_ELIGIBILITY_SECRET_VERSION}" \
              apiDaprEnabled="${API_DAPR_ENABLED}" \
              engagementStatusEnabled="${ENGAGEMENT_STATUS_ENABLED}" \
              engagementStatusVersion="${ENGAGEMENT_STATUS_VERSION}" \
              accountPrivateVersion="${NOTIFICATION_ACCOUNT_PRIVATE_SECRET_VERSION}" \
              engagementSendVersion="${NOTIFICATION_ENGAGEMENT_SEND_SECRET_VERSION}" \
              provisionPermissions=false \
              smtpAddr="${SMTP_ADDR}" \
              smtpFrom="${SMTP_FROM}" \
              smtpAuthenticationEnabled="${SMTP_AUTHENTICATION_ENABLED}" \
              vapidPublicKey="${VAPID_PUBLIC_KEY}" \
              vapidSubject="${VAPID_SUBJECT}" \
              notificationTemplateDailyLimit="${NOTIFICATION_TEMPLATE_DAILY_LIMIT}" \
              notificationsDisabled="${NOTIFICATIONS_DISABLED}" \
              sesFeedback="${SES_FEEDBACK_CONFIG}" \
              activeEncryptionKeyID="${ACTIVE_ENCRYPTION_KEY_ID}" \
              activeHashKeyID="${ACTIVE_HASH_KEY_ID}" \
            --no-pretty-print \
            --only-show-errors \
            --output none

      - name: Deploy alerts
        shell: bash
        run: |
          az deployment group create \
            --name "notification-alerts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/alerts.bicep \
            --only-show-errors \
            --output none

      - name: Update migration job
        shell: bash
        run: |
          az deployment group create \
            --name "notification-migrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --resource-group "${RESOURCE_GROUP}" \
            --template-file infra/main.bicep \
            --parameters \
              imageDigest="${IMAGE_DIGEST}" \
              notificationVaultName="${NOTIFICATION_VAULT_NAME}" \
              deployRuntime=false \
              provisionPermissions=false \
              smtpAddr="${SMTP_ADDR}" \
              smtpFrom="${SMTP_FROM}" \
              smtpAuthenticationEnabled="${SMTP_AUTHENTICATION_ENABLED}" \
              vapidPublicKey="${VAPID_PUBLIC_KEY}" \
              vapidSubject="${VAPID_SUBJECT}" \
              notificationTemplateDailyLimit="${NOTIFICATION_TEMPLATE_DAILY_LIMIT}" \
              notificationsDisabled="${NOTIFICATIONS_DISABLED}" \
              sesFeedback="${SES_FEEDBACK_CONFIG}" \
              activeEncryptionKeyID="${ACTIVE_ENCRYPTION_KEY_ID}" \
              activeHashKeyID="${ACTIVE_HASH_KEY_ID}" \
            --only-show-errors \
            --output none

      - name: Run migrations
        shell: bash
        run: |
          execution_name="$(az containerapp job start \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${MIGRATION_JOB_NAME}" \
            --query name \
            --output tsv \
            --only-show-errors)"
          if [[ -z "${execution_name}" ]]; then
            echo "Migration job did not return an execution name" >&2
            exit 1
          fi

          for attempt in {1..120}; do
            status="$(az containerapp job execution list \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${MIGRATION_JOB_NAME}" \
              --query "[?name=='${execution_name}'].properties.status | [0]" \
              --output tsv \
              --only-show-errors)"
            case "${status}" in
              Succeeded)
                echo "Migration execution ${execution_name} succeeded"
                exit 0
                ;;
              Failed|Canceled|Cancelled|Stopped)
                echo "Migration execution ${execution_name} ended with ${status}" >&2
                exit 1
                ;;
            esac
            echo "Waiting for migration execution ${execution_name}: ${status:-Pending} (${attempt}/120)"
            sleep 10
          done

          echo "Migration execution ${execution_name} did not succeed before timeout" >&2
          exit 1

      - name: Verify exact Engagement eligibility producer
        shell: bash
        run: |
          expected_uri="https://${NOTIFICATION_VAULT_NAME}.vault.azure.net/secrets/notification-worker-eligibility-token/${NOTIFICATION_WORKER_ELIGIBILITY_SECRET_VERSION}"
          expected_host="engagement-api.internal.gentleriver-81abd7bc.eastasia.azurecontainerapps.io"
          for attempt in {1..36}; do
            if producer="$(az containerapp show -g "${RESOURCE_GROUP}" -n engagement-api --only-show-errors -o json \
              --query "{latest:properties.latestRevisionName,ready:properties.latestReadyRevisionName,ingress:properties.configuration.ingress,credential:properties.configuration.secrets[?name=='notification-worker-eligibility-token'].keyVaultUrl,env:properties.template.containers[?name=='engagement-api'].env[] | [?name=='NOTIFICATION_WORKER_ELIGIBILITY_TOKEN'].secretRef}")" &&
              ready="$(jq -er --arg uri "${expected_uri}" --arg host "${expected_host}" '
                select(.latest == .ready and (.ready | test("^engagement-api--[a-z0-9-]+$"))
                  and .credential == [$uri] and .env == ["notification-worker-eligibility-token"]
                  and .ingress.fqdn == $host and .ingress.external == false
                  and .ingress.allowInsecure == false and .ingress.targetPort == 8082
                  and (.ingress.traffic | length) == 1 and .ingress.traffic[0].weight == 100
                  and (.ingress.traffic[0].latestRevision == true or .ingress.traffic[0].revisionName == .ready))
                | .ready
              ' <<< "${producer}")" &&
              health="$(az containerapp revision show -g "${RESOURCE_GROUP}" -n engagement-api --revision "${ready}" --only-show-errors -o json \
                --query '{active:properties.active,health:properties.healthState,running:properties.runningState,provisioned:properties.provisioningState}')" &&
              jq -e '.active == true and .health == "Healthy" and .running == "Running" and .provisioned == "Provisioned"' <<< "${health}" >/dev/null; then
              echo "Verified Engagement eligibility producer ${ready}"
              exit 0
            fi
            [[ "${attempt}" != 36 ]] || { echo "Engagement eligibility producer is not ready" >&2; exit 1; }
            sleep 10
          done

      - name: Deploy worker reader before API writer
        id: deploy_runtime
        shell: bash
        run: |
          echo "state=verification_unavailable" >> "$GITHUB_OUTPUT"
          wait_for_revision() {
            local app_name="$1" previous="$PREVIOUS_API_REVISION"
            [[ "$app_name" != "$WORKER_APP_NAME" ]] || previous="${2:-$PREVIOUS_WORKER_REVISION}"
            python3 scripts/verify-aca-revision.py "$RESOURCE_GROUP" "$app_name" "$IMAGE_REF" "$previous"
          }

          worker_revision_mode="$(az containerapp show \
            --resource-group "${RESOURCE_GROUP}" --name "${WORKER_APP_NAME}" \
            --query 'properties.configuration.activeRevisionsMode' --output tsv --only-show-errors)"
          [[ "${worker_revision_mode}" == "Single" ]] || { echo "Worker reader rollout requires Single revision mode" >&2; exit 1; }

          echo "state=verification_unavailable" >> "$GITHUB_OUTPUT"
          deploy_phase() {
            az deployment group create \
              --name "notification-$3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --resource-group "${RESOURCE_GROUP}" \
              --template-file infra/main.bicep \
              --parameters \
                imageDigest="${IMAGE_DIGEST}" \
                notificationVaultName="${NOTIFICATION_VAULT_NAME}" \
                deployRuntime=true \
                runtimePhase="$1" \
                workerDaprEnabled="$2" \
                workerRevisionSuffix="$3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
                workerEligibilityVersion="${NOTIFICATION_WORKER_ELIGIBILITY_SECRET_VERSION}" \
                apiDaprEnabled="${API_DAPR_ENABLED}" \
                engagementStatusEnabled="${ENGAGEMENT_STATUS_ENABLED}" \
                engagementStatusVersion="${ENGAGEMENT_STATUS_VERSION}" \
                accountPrivateVersion="${NOTIFICATION_ACCOUNT_PRIVATE_SECRET_VERSION}" \
                engagementSendVersion="${NOTIFICATION_ENGAGEMENT_SEND_SECRET_VERSION}" \
                provisionPermissions=false \
                smtpAddr="${SMTP_ADDR}" \
                smtpFrom="${SMTP_FROM}" \
                smtpAuthenticationEnabled="${SMTP_AUTHENTICATION_ENABLED}" \
                vapidPublicKey="${VAPID_PUBLIC_KEY}" \
                vapidSubject="${VAPID_SUBJECT}" \
                notificationTemplateDailyLimit="${NOTIFICATION_TEMPLATE_DAILY_LIMIT}" \
                notificationsDisabled="${NOTIFICATIONS_DISABLED}" \
                sesFeedback="${SES_FEEDBACK_CONFIG}" \
                activeEncryptionKeyID="${ACTIVE_ENCRYPTION_KEY_ID}" \
                activeHashKeyID="${ACTIVE_HASH_KEY_ID}" \
              --only-show-errors \
              --output none
          }
          deploy_phase worker "${PREVIOUS_WORKER_DAPR}" worker-reader
          wait_for_revision "${WORKER_APP_NAME}"
          reader_revision="${WORKER_APP_NAME}--worker-reader-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$(az containerapp show -g "${RESOURCE_GROUP}" -n "${WORKER_APP_NAME}" \
            --query properties.latestReadyRevisionName -o tsv --only-show-errors)" == "${reader_revision}" ]]
          for attempt in {1..60}; do
            echo "state=verification_unavailable" >> "$GITHUB_OUTPUT"
            old_replicas="$(az containerapp replica list \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${WORKER_APP_NAME}" \
              --revision "${PREVIOUS_WORKER_REVISION}" \
              --query 'length(@)' --output tsv --only-show-errors)"
            if [[ "${PREVIOUS_WORKER_IMAGE}" == "${IMAGE_REF}" || "${old_replicas}" == "0" ]]; then
              break
            fi
            [[ "${attempt}" != "60" ]] || { echo "Previous worker has not drained" >&2; exit 1; }
            sleep 10
          done
          if [[ "${PREVIOUS_WORKER_DAPR}" == true ]]; then
            deploy_phase worker false worker-sidecar-off
            wait_for_revision "${WORKER_APP_NAME}" "${reader_revision}"
            expected_worker="${WORKER_APP_NAME}--worker-sidecar-off-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            expected_worker="${reader_revision}"
          fi
          worker_runtime="$(az containerapp show -g "${RESOURCE_GROUP}" -n "${WORKER_APP_NAME}" \
            --query "join('|', [properties.latestReadyRevisionName, to_string(properties.configuration.dapr.enabled)])" -o tsv --only-show-errors)"
          [[ "${worker_runtime}" == "${expected_worker}|false" ]]
          echo "WORKER_READER_READY=true" >> "${GITHUB_ENV}"

          echo "state=verification_unavailable" >> "$GITHUB_OUTPUT"
          echo "API_RUNTIME_DEPLOY_ATTEMPTED=true" >> "${GITHUB_ENV}"
          deploy_phase api false api


      - name: Verify runtime Dapr boundaries
        shell: bash
        run: |
          worker_dapr="$(az containerapp show -g "${RESOURCE_GROUP}" -n "${WORKER_APP_NAME}" \
            --query properties.configuration.dapr.enabled -o tsv --only-show-errors)"
          [[ "${worker_dapr}" == false ]] || { echo "Worker Dapr must be disabled" >&2; exit 1; }
          api_dapr="$(az containerapp show -g "${RESOURCE_GROUP}" -n "${API_APP_NAME}" \
            --query properties.configuration.dapr -o json --only-show-errors)"
          jq -e --argjson enabled "${API_DAPR_ENABLED}" '
            .enabled == $enabled and (if $enabled then .appId == "notification-api" and .appPort == 8081 else true end)
          ' <<< "${api_dapr}" >/dev/null

      - name: Verify ACA revisions
        id: smoke_runtime
        shell: bash
        run: |
          python3 scripts/verify-aca-revision.py "$RESOURCE_GROUP" "$API_APP_NAME" "$IMAGE_REF" "$PREVIOUS_API_REVISION"
          python3 scripts/verify-aca-revision.py "$RESOURCE_GROUP" "$WORKER_APP_NAME" "$IMAGE_REF" "$PREVIOUS_WORKER_REVISION"
          python3 scripts/engagement_status_release.py verify-writes

      - name: Capture healthy release
        id: release_outputs
        shell: bash
        run: |
          echo "commit=${RELEASE_COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE_REF}" >> "${GITHUB_OUTPUT}"

      - name: Roll back runtime after failed deployment verification
        if: ${{ failure() && (steps.deploy_runtime.outputs.state == 'unhealthy' || steps.smoke_runtime.outputs.state == 'unhealthy') }}
        shell: bash
        run: |
          rollback() {
            local app_name="$1"
            local previous_revision="$2"
            local image_ref="$3"
            az containerapp revision copy \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${app_name}" \
              --from-revision "${previous_revision}" \
              --revision-suffix "rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --only-show-errors \
              --output none
            for attempt in {1..60}; do
              state="$(az containerapp show \
                --resource-group "${RESOURCE_GROUP}" \
                --name "${app_name}" \
                --query "join('|', [properties.latestRevisionName, properties.latestReadyRevisionName])" \
                --output tsv \
                --only-show-errors)"
              IFS='|' read -r latest ready <<< "${state}"
              if [[ -n "${latest}" && "${latest}" == "${ready}" ]]; then
                deployed_image="$(az containerapp revision show \
                  --resource-group "${RESOURCE_GROUP}" \
                  --name "${app_name}" \
                  --revision "${ready}" \
                  --query "properties.template.containers[0].image" \
                  --output tsv \
                  --only-show-errors)"
                if [[ "${deployed_image}" == "${image_ref}" ]]; then
                  echo "Rolled back ${app_name} to ${image_ref}"
                  return 0
                fi
              fi
              sleep 10
            done
            echo "Rollback failed for ${app_name}" >&2
            return 1
          }

          rollback_status=0
          if [[ "${API_RUNTIME_DEPLOY_ATTEMPTED:-false}" == "true" ]]; then
            rollback "${API_APP_NAME}" "${PREVIOUS_API_REVISION}" "${PREVIOUS_API_IMAGE}" || rollback_status=1
          fi
          if [[ "${WORKER_READER_READY:-false}" != "true" ]]; then
            if [[ "${PREVIOUS_WORKER_DAPR}" == true ]]; then
              az containerapp dapr enable -g "${RESOURCE_GROUP}" -n "${WORKER_APP_NAME}" \
                --dapr-app-id notification-worker --dapr-app-port 8081 --dapr-app-protocol http --dapr-log-level warn \
                --only-show-errors --output none || exit 1
            fi
            rollback "${WORKER_APP_NAME}" "${PREVIOUS_WORKER_REVISION}" "${PREVIOUS_WORKER_IMAGE}" || rollback_status=1
            restored_dapr="$(az containerapp show -g "${RESOURCE_GROUP}" -n "${WORKER_APP_NAME}" \
              --query properties.configuration.dapr -o json --only-show-errors)"
            jq -e --argjson enabled "${PREVIOUS_WORKER_DAPR}" '
              .enabled == $enabled and
              (if $enabled then .appId == "notification-worker" and .appPort == 8081 else true end)
            ' <<< "${restored_dapr}" >/dev/null || rollback_status=1
          else
            echo "Keeping compatible worker reader to settle persisted template versions"
          fi
          exit "${rollback_status}"

  publish_openapi:
    needs: [deploy, plan]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      STORAGE_ACCOUNT: hhcapidocsprod
      CONTAINER: api-docs-notification-api
      API_DOCS_AZURE_CLIENT_ID: ${{ vars.API_DOCS_AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RELEASE_COMMIT: ${{ needs.deploy.outputs.commit }}
      RELEASE_IMAGE: ${{ needs.deploy.outputs.image }}
      FAIL_OPENAPI_BEFORE_POINTER: ${{ inputs.fail_openapi_before_pointer && github.run_attempt == 1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.deploy.outputs.commit }}
      - name: Download verified governance manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: data-governance-${{ needs.deploy.outputs.commit }}
          run-id: ${{ needs.plan.outputs.source_run }}
          github-token: ${{ github.token }}
          path: .artifacts/data-governance/export
          digest-mismatch: error
      - name: Validate publication configuration
        shell: bash
        run: |
          [[ "${RELEASE_COMMIT}" == "$(git rev-parse HEAD)" ]]
          [[ "${RELEASE_IMAGE}" == alive.azurecr.io/alive/notification-api@sha256:* ]]
          for name in API_DOCS_AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            test -n "${!name:-}" || { echo "Missing repository variable: ${name}" >&2; exit 1; }
          done
      - name: Sign in with API docs publisher identity
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.API_DOCS_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish production OpenAPI contract
        shell: bash
        run: |
          spec_blob="specs/${RELEASE_COMMIT}/openapi.yaml"
          spec_sha256="$(sha256sum docs/openapi.yaml | cut -d " " -f 1)"
          is_canonical_run_id() { [[ "$1" =~ ^[1-9][0-9]*$ ]]; }
          if ! is_canonical_run_id "${GITHUB_RUN_ID}"; then
            echo "Invalid GITHUB_RUN_ID: expected canonical positive decimal" >&2
            exit 1
          fi
          spec_exists="$(az storage blob exists \
            --account-name "${STORAGE_ACCOUNT}" \
            --container-name "${CONTAINER}" \
            --name "${spec_blob}" \
            --auth-mode login \
            --only-show-errors \
            --query exists \
            --output tsv)"
          if [[ "${spec_exists}" == "true" ]]; then
            existing_spec="$(mktemp)"
            az storage blob download \
              --account-name "${STORAGE_ACCOUNT}" \
              --container-name "${CONTAINER}" \
              --name "${spec_blob}" \
              --file "${existing_spec}" \
              --auth-mode login \
              --no-progress \
              --only-show-errors \
              --output none
            [[ "$(sha256sum "${existing_spec}" | cut -d " " -f 1)" == "${spec_sha256}" ]] || {
              echo "Existing OpenAPI spec hash does not match" >&2
              exit 1
            }
          else
            az storage blob upload \
              --account-name "${STORAGE_ACCOUNT}" \
              --container-name "${CONTAINER}" \
              --name "${spec_blob}" \
              --file docs/openapi.yaml \
              --auth-mode login \
              --overwrite false \
              --only-show-errors \
              --output none
          fi

          jq -n \
            --arg service notification-api \
            --arg commit "${RELEASE_COMMIT}" \
            --arg image "${RELEASE_IMAGE}" \
            --arg specBlob "${spec_blob}" \
            --arg specSha256 "${spec_sha256}" \
            --arg releaseUrl "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, service: $service, commit: $commit, image: $image, specBlob: $specBlob, specSha256: $specSha256, releaseUrl: $releaseUrl, publishedAt: $publishedAt}' \
            > current.json

          if [[ "${FAIL_OPENAPI_BEFORE_POINTER}" == "true" ]]; then
            echo "Requested failure before API docs pointer upload" >&2
            exit 1
          fi

          pointer_exists="$(az storage blob exists \
            --account-name "${STORAGE_ACCOUNT}" \
            --container-name "${CONTAINER}" \
            --name current.json \
            --auth-mode login \
            --only-show-errors \
            --query exists \
            --output tsv)"
          if [[ "${pointer_exists}" == "true" ]]; then
            current_pointer="$(mktemp)"
            az storage blob download \
              --account-name "${STORAGE_ACCOUNT}" \
              --container-name "${CONTAINER}" \
              --name current.json \
              --file "${current_pointer}" \
              --auth-mode login \
              --no-progress \
              --only-show-errors \
              --output none
            current_run_id="$(jq -er --arg release_url_prefix "https://github.com/${GITHUB_REPOSITORY}/actions/runs/" '
              .releaseUrl? as $release_url
              | if ($release_url | type) == "string" and ($release_url | startswith($release_url_prefix))
                then ($release_url | ltrimstr($release_url_prefix))
                else empty
                end
            ' "${current_pointer}" 2>/dev/null)" || {
              echo "Invalid existing API docs pointer: expected canonical GitHub workflow run ID" >&2
              exit 1
            }
            if ! is_canonical_run_id "${current_run_id}"; then
              echo "Invalid existing API docs pointer: expected canonical GitHub workflow run ID" >&2
              exit 1
            fi
            export LC_ALL=C
            if [[ ${#current_run_id} -gt ${#GITHUB_RUN_ID} ]] || { [[ ${#current_run_id} -eq ${#GITHUB_RUN_ID} ]] && [[ "${current_run_id}" > "${GITHUB_RUN_ID}" || "${current_run_id}" == "${GITHUB_RUN_ID}" ]]; }; then
              echo "API docs pointer already belongs to workflow run ${current_run_id}; skipping stale or rerun publication"
              exit 0
            fi
          fi

          az storage blob upload \
            --account-name "${STORAGE_ACCOUNT}" \
            --container-name "${CONTAINER}" \
            --name current.json \
            --file current.json \
            --auth-mode login \
            --overwrite true \
            --only-show-errors \
            --output none
      - name: Publish verified governance manifest
        env:
          SERVICE: notification-api
          RELEASE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GOVERNANCE_DIR: ${{ github.workspace }}/.artifacts/data-governance/export
        run: bash scripts/publish-data-governance.sh
